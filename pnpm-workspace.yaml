packages:
  - 'frontend'
  - 'agent'

allowBuilds:
  # required by vitest's transformer
  esbuild: true
  # required by @opentelemetry/exporter-trace-otlp-proto
  protobufjs: true
  # required by @fohte/eslint-config -> eslint-plugin-import-x for module resolution
  unrs-resolver: true
  # required by cloudflare/wrangler-action's internal `pnpm add wrangler` step (Storybook deploy)
  workerd: true
  # no-op unless package.json sets "msw.workerDirectory", which we don't use
  msw: true
  sharp: set this to true or false

# Dodge short-lived supply-chain attacks (e.g. shai-hulud, tinycolor) by
# holding off freshly published versions. Unit is minutes; 10080 = 7 days.
minimumReleaseAge: 10080
# First-party scopes: publisher account is trusted, so skip the release-age delay.
minimumReleaseAgeExclude:
  - '@fohte/*'
  # Exact-pinned security-fix versions; safe to remove once each version's
  # natural age exceeds minimumReleaseAge.
  - '@hono/node-server@2.0.10'
  - hono@4.12.34
  # Renovate security update: wrangler@3.114.17
  - wrangler@3.114.17

peerDependencyRules:
  allowedVersions:
    # openapi-typescript's peerDependencies still declare typescript ^5.x;
    # remove once it's updated to allow ^6.
    'openapi-typescript>typescript': '6'
