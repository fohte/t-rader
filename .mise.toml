[env]
# db のホストポートはランダム割り当て (全 worktree 共有) のため、mise 実行のたびに
# scripts/db-url でポートを解決する (キャッシュしない)。_.file より前に書くことで
# .env.local による上書きを維持している
DATABASE_URL = "{{ exec(command=config_root ~ '/scripts/db-url') }}"
_.file = ['.env', '.env.local']
# Share target dir across worktrees to avoid full recompilation
CARGO_TARGET_DIR = "{{config_root}}/target"

[tasks.db-up]
description = "DB を起動する"
file = "scripts/db-up"

[tools]
lefthook = "2.1.10"
"github:ast-grep/ast-grep" = "0.45.2"
"cargo:sea-orm-cli" = "2.0.0-rc.40"

# lefthook hooks
actionlint = "1.7.12"
"github:betterleaks/betterleaks" = "1.7.3"
node = "24.19.0"
pinact = "4.1.1"
"github:fohte/basefmt" = "0.1.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"
