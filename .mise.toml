[env]
_.file = ['.env', '.env.runtime', '.env.local']
# Share target dir across worktrees to avoid full recompilation
CARGO_TARGET_DIR = "{{config_root}}/target"

[tasks.db-up]
description = "DB を起動し、実ポートを反映した DATABASE_URL を .env.runtime に生成する"
run = '''
#!/usr/bin/env bash
set -euo pipefail

docker compose -f docker-compose.infra.yml up -d

host_port="$(docker compose -f docker-compose.infra.yml port db 5432)"
port="${host_port##*:}"

cat > .env.runtime <<EOF
# mise run db-up が自動生成するファイル。直接編集しないこと。
DATABASE_URL=postgres://${POSTGRES_USER:-t_rader}:${POSTGRES_PASSWORD:-t_rader}@127.0.0.1:${port}/${POSTGRES_DB:-t_rader_development}
EOF

echo "Generated .env.runtime (db port: ${port})"
'''

[tools]
lefthook = "2.1.9"
"github:ast-grep/ast-grep" = "0.44.0"
"cargo:sea-orm-cli" = "2.0.0-rc.40"

# lefthook hooks
actionlint = "1.7.12"
"github:betterleaks/betterleaks" = "1.6.1"
node = "24.18.0"
pinact = "4.1.0"
"github:fohte/basefmt" = "0.1.0"
"npm:@commitlint/cli" = "21.2.0"
"npm:prettier" = "3.9.4"
shellcheck = "0.11.0"
shfmt = "3.13.1"
