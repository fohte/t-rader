services:
  backend:
    build:
      context: ./backend
      target: dev
    working_dir: /app
    command: cargo watch -x run
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-t_rader}:${POSTGRES_PASSWORD:-t_rader}@db:5432/${POSTGRES_DB:-t_rader_development}
      CARGO_HOME: /usr/local/cargo
    ports:
      - '127.0.0.1::3000'
    volumes:
      - ./backend:/app
      - cargo_home:/usr/local/cargo
      - backend_target:/app/target
    networks:
      - t-rader-net

  agent:
    build:
      context: ./agent
      target: dev
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-t_rader}:${POSTGRES_PASSWORD:-t_rader}@db:5432/t_rader_agent_development
      TRADER_AGENT_PORT: '8080'
      TRADER_AGENT_URL: http://agent:8080/
      INTERNAL_API_TOKEN: dev-internal-token
      BACKEND_WEBHOOK_URL: http://backend:3000/api/agent-tasks/notifications
      BACKEND_WEBHOOK_TOKEN: dev-webhook-token
      BACKEND_API_BASE_URL: http://backend:3000
      STRATEGY_MCP_URL: http://backend:3000/mcp/strategy
      MGMT_MCP_URL: http://backend:3000/mcp/mgmt
    ports:
      - '127.0.0.1::8080'
    volumes:
      - ./agent:/app
      - agent_node_modules:/app/node_modules
    networks:
      - t-rader-net

  frontend:
    image: node:24.17.0-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm run dev --host"
    environment:
      VITE_API_URL: http://backend:3000
    ports:
      - '127.0.0.1::5173'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - t-rader-net

volumes:
  cargo_home:
  backend_target:
  frontend_node_modules:
  agent_node_modules:

networks:
  t-rader-net:
    external: true
