# インフラ専用 Compose ファイル
# 全 worktree で共有する。1 回だけ起動すればよい:
#   mise run db-up
name: t-rader-infra

services:
  db:
    image: timescale/timescaledb:latest-pg17
    command: [postgres, -c, max_connections=200]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-t_rader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-t_rader}
      POSTGRES_DB: ${POSTGRES_DB:-t_rader_development}
    ports:
      - '127.0.0.1::5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-t_rader}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - t-rader-net

  redis:
    image: redis:8-alpine
    command:
      - --user
      - default
      - off
      - --user
      - rate-limit-test
      - on
      - '>test-password'
      - '~t-rader:*'
      - '+@connection'
      - '+select'
      - '+@scripting'
      - '+get'
      - '+set'
      - '+pttl'
      - '+time'
    ports:
      - '127.0.0.1::6379'
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -u redis://rate-limit-test:test-password@127.0.0.1:6379 EVAL "return 1" 0
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - t-rader-net

volumes:
  db_data:

networks:
  t-rader-net:
    name: t-rader-net
