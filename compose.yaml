name: t-rader-infra

services:
  db:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      # Existing data directories keep initialized roles and databases when these values change.
      POSTGRES_USER: 't_rader'
      POSTGRES_PASSWORD: 't_rader'
    ports:
      - '127.0.0.1::5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U t_rader -d postgres']
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
