services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    working_dir: /app/backend
    command: cargo watch -x 'run -p backend'
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://t-rader:t-rader@db:5432/t-rader_backend_dev
      REDIS_URL: redis://rate-limit-test:test-password@redis:6379/
      CARGO_HOME: /usr/local/cargo
    ports:
      - '127.0.0.1::3000'
      - '127.0.0.1::3001'
    volumes:
      - .:/app
      - cargo_home:/usr/local/cargo
      - backend_target:/app/backend/target
    networks:
      - t-rader-net

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
      target: dev
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://t-rader:t-rader@db:5432/t-rader_agent_dev
      TRADER_AGENT_PORT: '8080'
      TRADER_AGENT_URL: http://agent:8080/
      INTERNAL_API_TOKEN: dev-internal-token
      BACKEND_WEBHOOK_TOKEN: dev-webhook-token
      BACKEND_API_BASE_URL: http://backend:3000
    ports:
      - '127.0.0.1::8080'
    volumes:
      - ./agent:/app/agent
      - agent_node_modules:/app/agent/node_modules
    networks:
      - t-rader-net

  frontend:
    image: node:24.20.0-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm --filter frontend... install && pnpm --filter frontend run dev --host"
    environment:
      VITE_API_URL: http://backend:3000
    ports:
      - '127.0.0.1::5173'
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      - backend
    networks:
      - t-rader-net

volumes:
  cargo_home:
  backend_target:
  root_node_modules:
  frontend_node_modules:
  agent_node_modules:

networks:
  t-rader-net:
    external: true
