id: no-direct-db-in-backend
language: rust
severity: error
message: |-
  backend/src/ の handler / MCP / service から DB に直接アクセスしないでください。
note: |-
  application の port とユースケースを追加し、Postgres adapter は gateways/postgres に実装してください。
  services/use_cases/<aggregate>.rs から組み立て、HTTP / MCP の entrypoint はユースケースを呼び出してください。
  詳細は docs/backend-architecture.md の「集約のユースケース追加」と「権限とトランザクション」を参照してください。
  ignores に列挙した既存違反は暫定除外です。新しい違反を追加せず、解消後は該当パスを ignores から外してください。
files:
  - backend/src/**/*.rs
ignores:
  # composition root とテスト用ファイル。
  - backend/src/main.rs
  - backend/src/integration_tests.rs
  - backend/src/testing.rs
  - backend/src/**/tests*.rs
  - backend/src/services/use_cases.rs
  - backend/src/services/use_cases/**/*.rs
  # 既存の直接 DB アクセスが残るファイル。違反を解消したら ignores から外す。
  - backend/src/services/*_ingest.rs
  - backend/src/services/edinet_holdings/mod.rs
  - backend/src/services/stock_master_sync.rs
  - backend/src/mcp/watcher.rs
  - backend/src/handlers/annotations.rs
  - backend/src/handlers/comments.rs
  - backend/src/handlers/note_versions.rs
  - backend/src/handlers/strategies/mod.rs
  - backend/src/mcp/strategy/annotations.rs
  - backend/src/mcp/strategy/comments.rs
  - backend/src/mcp/strategy/evidence.rs
  - backend/src/mcp/strategy/mod.rs
  - backend/src/mcp/strategy/risk_check.rs
  - backend/src/mcp/strategy/web_search.rs
  - backend/src/mcp/mgmt/mod.rs
  - backend/src/mcp/mgmt/notes_annotations.rs
  - backend/src/models/annotation.rs
  - backend/src/models/comment.rs
  - backend/src/models/note.rs
  - backend/src/models/note_version.rs
  - backend/src/services/change_history.rs
  - backend/src/services/note_versions.rs
  - backend/src/services/strategies.rs
  - backend/src/services/strategy_tasks/mod.rs
  - backend/src/services/strategy_tasks/resume.rs
utils:
  sea-orm-db-symbol:
    kind: identifier
    regex: '^(ActiveModelTrait|ActiveValue|ColumnTrait|ConnectionTrait|Database|DatabaseConnection|DatabaseTransaction|EntityTrait|PaginatorTrait|QueryFilter|QueryOrder|QuerySelect|QueryTrait|TransactionTrait|OnConflict)$'
rule:
  any:
    - kind: scoped_identifier
      regex: '^gateway_postgres::(entities|repositories|Postgres[A-Za-z0-9_]*)'
    - kind: scoped_type_identifier
      regex: '^gateway_postgres::(entities|repositories|Postgres[A-Za-z0-9_]*)'
    - kind: scoped_use_list
      regex: '^gateway_postgres::(entities|repositories|Postgres[A-Za-z0-9_]*)'
    - kind: use_as_clause
      regex: '^gateway_postgres::(entities|repositories|Postgres[A-Za-z0-9_]*)'
    - kind: use_as_clause
      regex: '^gateway_postgres\s+as\s+'
    - kind: identifier
      regex: '^(entities|repositories|Postgres[A-Za-z0-9_]+)$'
      inside:
        kind: use_list
        inside:
          kind: scoped_use_list
          has:
            field: path
            pattern: gateway_postgres
          stopBy: end
        stopBy: end
    - matches: sea-orm-db-symbol
      inside:
        any:
          - kind: scoped_identifier
            regex: '^sea_orm::'
          - kind: scoped_type_identifier
            regex: '^sea_orm::'
          - kind: scoped_use_list
            regex: '^sea_orm::'
        stopBy: end
    - kind: use_as_clause
      regex: '^sea_orm\s+as\s+'
    - pattern: $DATABASE.begin()
      not:
        has:
          field: function
          regex: '(^|\.)unit_of_work\.begin$'
    - pattern: $DATABASE.execute_unprepared($$$ARGS)
    - kind: use_wildcard
      has:
        any:
          - kind: scoped_identifier
            regex: '^sea_orm(::|$)'
          - kind: identifier
            regex: '^sea_orm$'
  not:
    inside:
      any:
        - all:
            - kind: mod_item
            - follows:
                kind: attribute_item
                regex: 'cfg\s*\(\s*test\s*\)'
        - all:
            - kind: function_item
            - follows:
                kind: attribute_item
                regex: 'cfg\s*\(\s*test\s*\)'
        - all:
            - kind: use_declaration
            - follows:
                kind: attribute_item
                regex: 'cfg\s*\(\s*test\s*\)'
        - all:
            - kind: function_item
            - has:
                field: name
                regex: '^health_check$'
      stopBy: end
