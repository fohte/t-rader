id: no-direct-db-in-backend
valid:
  - |
    use sea_orm::DbErr;

    fn map_error(error: DbErr) -> DbErr {
        error
    }
  - |
    use core_application::unit_of_work::UnitOfWork;

    async fn begin_transaction(unit_of_work: &impl UnitOfWork) {
        let _transaction = unit_of_work.begin().await;
    }
  - |
    struct State {
        unit_of_work: Box<dyn UnitOfWork>,
    }

    impl State {
        async fn begin_transaction(&self) {
            let _transaction = self.unit_of_work.begin().await;
        }
    }
  - |
    fn send_request(client: &HttpClient, request: Request) {
        let _ = client.execute(request);
    }
  - |
    async fn health_check(state: AppState) -> Result<(), DbErr> {
        state.db.execute_unprepared("SELECT 1").await?;
        Ok(())
    }
  - |
    #[cfg(test)]
    mod tests {
        use gateway_postgres::entities::sample_record;
        use sea_orm::{ActiveModelTrait, EntityTrait};
    }
  - |
    #[cfg(test)]
    use gateway_postgres::repositories::sample_store;
  - |
    #[cfg(test)]
    fn create_fixture() {
        let _ = gateway_postgres::entities::sample_record::Entity;
    }
