services:
  db:
    image: timescale/timescaledb:2.26.4-pg18@sha256:9ecddf2c88356f01f2986a0349ea525a5f7c56b81935bbfd58e9590c93f7d859
    command: [postgres, -c, max_connections=200]
    networks:
      - t-rader-net

  redis:
    image: redis:8-alpine
    command:
      - --user
      - default
      - off
      - --user
      - rate-limit-test
      - on
      - '>test-password'
      - '~t-rader:*'
      - '+@connection'
      - '+select'
      - '+@scripting'
      - '+get'
      - '+set'
      - '+pttl'
      - '+time'
    ports:
      - '127.0.0.1::6379'
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -u redis://rate-limit-test:test-password@127.0.0.1:6379 EVAL "return 1" 0
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - t-rader-net

volumes:
  postgres-data:
    name: t-rader-infra_db_data

networks:
  t-rader-net:
    name: t-rader-net
