services:
  db:
    image: timescale/timescaledb:2.30.1-pg17@sha256:c79fa5891443d1cdf6de5258d4c2bdb8cde29052c45df2062b13d351e0202005
    command: [postgres, -c, max_connections=200]
    # 既存の PG17 volume を保持したまま、TimescaleDB の PGDATA で再利用する。
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
    networks:
      - t-rader-net

  redis:
    image: redis:8-alpine
    command:
      - --user
      - default
      - off
      - --user
      - rate-limit-test
      - on
      - '>test-password'
      - '~t-rader:*'
      - '+@connection'
      - '+select'
      - '+@scripting'
      - '+get'
      - '+set'
      - '+pttl'
      - '+time'
    ports:
      - '127.0.0.1::6379'
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -u redis://rate-limit-test:test-password@127.0.0.1:6379 EVAL "return 1" 0
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - t-rader-net

volumes:
  postgres-data:
    name: t-rader-infra_db_data

networks:
  t-rader-net:
    name: t-rader-net
