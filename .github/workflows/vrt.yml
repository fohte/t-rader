name: VRT

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-slim
    outputs:
      changed: ${{ steps.changes.outputs.any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check for changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes
        with:
          files: |
            frontend/**
            .github/workflows/vrt.yml
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml

  capture:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.15

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - uses: fohte/storybook-vrt-workflows/vrt-capture@46d0eb34f801e2f11d497b30e69f8287f9e4af84 # v0.1.0
        with:
          project: storybook-screenshot
          shard: 1
          shards: 1
          capture-script: storybook:screenshot
          package-dir: frontend
          screenshots-dir: __screenshots__/desktop

  report:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    # Overlapping runs for the same ref would otherwise race to publish to the
    # same R2 key at once -- most importantly two main pushes racing to
    # update the single `baseline/actual/` key, where each run's diff was
    # computed against a baseline the other run is concurrently mutating.
    concurrency:
      group: vrt-report-${{ (github.ref == 'refs/heads/main') && 'push' || 'pr' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.15

      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - uses: fohte/storybook-vrt-workflows/vrt-report@46d0eb34f801e2f11d497b30e69f8287f9e4af84 # v0.1.0
        with:
          package-dir: frontend
          screenshots-dir: __screenshots__/desktop
          r2-bucket: t-rader-vrt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
