name: Build perf DB image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/perf-db-image.yml
      - backend/migration/**
      - backend/perf-db/**
      - backend/scripts/build-perf-db-image.sh

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push perf DB image
        run: backend/scripts/build-perf-db-image.sh --push
