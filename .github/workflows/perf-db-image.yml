name: Build perf DB image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/perf-db-image.yml
      - backend/migration/**
      - backend/perf-db/**
      - backend/scripts/build-perf-db-image.sh

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push perf DB image
        run: backend/scripts/build-perf-db-image.sh --push
