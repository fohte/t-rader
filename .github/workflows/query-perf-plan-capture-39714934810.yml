name: Query performance plan capture

on:
  push:
    branches:
      - fohte/query-perf-plan-capture-39714934810

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  capture-query-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      CARGO_INCREMENTAL: '0'
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
      SOURCE_CHECKOUT_SHA: d24a3e71dac02684f1d752c4d37aeb6462ca5c91
      CAPTURE_OUTPUT_DIR: query-perf-plan-capture
    services:
      db:
        image: timescale/timescaledb:2.26.4-pg18@sha256:9ecddf2c88356f01f2986a0349ea525a5f7c56b81935bbfd58e9590c93f7d859
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare diagnostic artifact directory
        run: mkdir -p "$CAPTURE_OUTPUT_DIR" "$RUNNER_TEMP/backend-query-log-regenerated"

      - name: Verify fixed source and diagnostic-only changes
        run: backend/scripts/verify-query-perf-plan-capture-source.sh

      - run: rustup show

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.11

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@50414676f9f5d50a65992c6dd2ed02641263226c # v2.82.10
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Tune PostgreSQL for backend tests
        env:
          DB_CONTAINER_ID: ${{ job.services.db.id }}
        run: bash backend/scripts/query-perf-plan-capture-tune-postgres.sh

      - name: Configure Redis ACL for rate limit tests
        env:
          REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
        run: |
          set -euo pipefail
          docker exec "$REDIS_CONTAINER_ID" redis-cli ACL SETUSER \
            rate-limit-test reset on \
            '>test-password' '~t-rader:*' \
            +@connection +select +@scripting +get +set +pttl +time
          docker exec "$REDIS_CONTAINER_ID" redis-cli ACL SETUSER default reset off

      - name: Test Python exec wrapper
        run: python3 -m unittest backend/docker/python-exec/test_entrypoint.py

      - name: Regenerate backend query log with the pinned source tests
        id: backend-tests
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_test
          REDIS_URL: redis://rate-limit-test:test-password@localhost:6379/
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Capture regenerated PostgreSQL query log
        id: capture-query-log
        if: always()
        continue-on-error: true
        env:
          DB_CONTAINER_ID: ${{ job.services.db.id }}
        run: bash backend/scripts/query-perf-plan-capture-copy-query-log.sh

      - name: Upload regenerated backend query log
        id: upload-regenerated-log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-query-log-regenerated-${{ github.run_id }}
          path: ${{ runner.temp }}/backend-query-log-regenerated/postgresql.json
          if-no-files-found: warn
          retention-days: 1

      - name: Compare regenerated log to the hash-only reference
        id: input-comparison
        if: always()
        continue-on-error: true
        env:
          DB_CONTAINER_ID: ${{ job.services.db.id }}
          INPUT_ARTIFACT_NAME: backend-query-log-regenerated-${{ github.run_id }}
          INPUT_ARTIFACT_ID: ${{ steps.upload-regenerated-log.outputs.artifact-id }}
          QUERY_LOG_PATH: ${{ runner.temp }}/backend-query-log-regenerated/postgresql.json
        run: bash backend/scripts/query-perf-plan-capture-compare-input.sh

      - name: Stop backend test services before starting the perf database
        if: always()
        env:
          DB_CONTAINER_ID: ${{ job.services.db.id }}
          REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
        run: |
          set -euo pipefail
          docker stop "$DB_CONTAINER_ID" "$REDIS_CONTAINER_ID" >/dev/null 2>&1 || true

      - name: Log in to GHCR
        id: ghcr-login
        if: >-
          steps.backend-tests.outcome == 'success' &&
          steps.capture-query-log.outcome == 'success' &&
          steps.upload-regenerated-log.outcome == 'success' &&
          steps.input-comparison.outputs.group_matches == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Capture group query plans without replay
        id: capture-plans
        if: >-
          steps.backend-tests.outcome == 'success' &&
          steps.capture-query-log.outcome == 'success' &&
          steps.upload-regenerated-log.outcome == 'success' &&
          steps.input-comparison.outputs.group_matches == 'true' &&
          steps.ghcr-login.outcome == 'success'
        env:
          QUERY_LOG_FILE: ${{ runner.temp }}/backend-query-log-regenerated/postgresql.json
          INPUT_ARTIFACT_NAME: backend-query-log-regenerated-${{ github.run_id }}
          INPUT_ARTIFACT_ID: ${{ steps.upload-regenerated-log.outputs.artifact-id }}
          INPUT_MANIFEST_FILE: query-perf-plan-capture/input/regenerated-manifest.json
          INPUT_COMPARISON_FILE: query-perf-plan-capture/input/comparison.json
          INPUT_GROUP_BINDS_FILE: query-perf-plan-capture/binds/source-binds.json
          CAPTURE_OUTPUT_DIR: query-perf-plan-capture
        run: backend/scripts/capture-group-query-plans.sh

      - name: Remove any remaining perf DB container
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -Fxq 'query-perf-group-plan-capture-db'; then
            docker rm --force query-perf-group-plan-capture-db
          fi

      - name: Record why replay or plan capture was skipped
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.backend-tests.outcome }}
          LOG_CAPTURE_OUTCOME: ${{ steps.capture-query-log.outcome }}
          LOG_UPLOAD_OUTCOME: ${{ steps.upload-regenerated-log.outcome }}
          INPUT_COMPARISON_OUTCOME: ${{ steps.input-comparison.outcome }}
          INPUT_COMPARISON_MATCHES: ${{ steps.input-comparison.outputs.matches }}
          GROUP_COMPARISON_MATCHES: ${{ steps.input-comparison.outputs.group_matches }}
          GHCR_LOGIN_OUTCOME: ${{ steps.ghcr-login.outcome }}
          PLAN_CAPTURE_OUTCOME: ${{ steps.capture-plans.outcome }}
        run: bash backend/scripts/query-perf-plan-capture-record-prerequisites.sh

      - name: Fail when test input validation or plan capture failed
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.backend-tests.outcome }}
          LOG_CAPTURE_OUTCOME: ${{ steps.capture-query-log.outcome }}
          LOG_UPLOAD_OUTCOME: ${{ steps.upload-regenerated-log.outcome }}
          INPUT_COMPARISON_OUTCOME: ${{ steps.input-comparison.outcome }}
          INPUT_COMPARISON_MATCHES: ${{ steps.input-comparison.outputs.matches }}
          GROUP_COMPARISON_MATCHES: ${{ steps.input-comparison.outputs.group_matches }}
          GHCR_LOGIN_OUTCOME: ${{ steps.ghcr-login.outcome }}
          PLAN_CAPTURE_OUTCOME: ${{ steps.capture-plans.outcome }}
        run: bash backend/scripts/query-perf-plan-capture-check-results.sh

      - name: Upload query plans and diagnostic results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: query-perf-plan-capture-${{ github.run_id }}
          path: query-perf-plan-capture
          if-no-files-found: error
          retention-days: 14
