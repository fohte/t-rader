name: Query performance plan capture

on:
  push:
    branches:
      - fohte/query-perf-plan-capture-39714934810

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  capture-query-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      CARGO_INCREMENTAL: '0'
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
      SOURCE_CHECKOUT_SHA: d24a3e71dac02684f1d752c4d37aeb6462ca5c91
      CAPTURE_OUTPUT_DIR: query-perf-plan-capture
    services:
      db:
        image: timescale/timescaledb:2.26.4-pg18@sha256:9ecddf2c88356f01f2986a0349ea525a5f7c56b81935bbfd58e9590c93f7d859
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare diagnostic artifact directory
        run: mkdir -p "$CAPTURE_OUTPUT_DIR" "$RUNNER_TEMP/backend-query-log-regenerated"

      - name: Verify fixed source and diagnostic-only changes
        run: backend/scripts/verify-query-perf-plan-capture-source.sh

      - run: rustup show

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.11

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@50414676f9f5d50a65992c6dd2ed02641263226c # v2.82.10
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Tune PostgreSQL for backend tests
        env:
          DB_CONTAINER_ID: ${{ job.services.db.id }}
        run: |
          set -euo pipefail

          db_psql() {
            docker exec "$DB_CONTAINER_ID" psql \
              --username=t_rader \
              --dbname=t_rader_test \
              --set=ON_ERROR_STOP=1 \
              "$@"
          }

          dump_db_logs() {
            echo "::group::PostgreSQL service logs"
            docker logs "$DB_CONTAINER_ID" || true
            docker exec "$DB_CONTAINER_ID" sh -c '
              for log_file in "$PGDATA"/log/*.json; do
                [ -f "$log_file" ] || continue
                cat "$log_file"
              done
            ' || true
            echo "::endgroup::"
          }

          db_psql \
            --command="ALTER SYSTEM SET fsync = off" \
            --command="ALTER SYSTEM SET synchronous_commit = off" \
            --command="ALTER SYSTEM SET full_page_writes = off" \
            --command="ALTER SYSTEM SET timescaledb.max_background_workers = 0" \
            --command="ALTER SYSTEM SET logging_collector = on" \
            --command="ALTER SYSTEM SET log_destination = 'jsonlog'" \
            --command="ALTER SYSTEM SET log_statement = 'all'" \
            --command="ALTER SYSTEM SET log_parameter_max_length = -1" \
            --command="ALTER SYSTEM SET log_rotation_age = 0" \
            --command="ALTER SYSTEM SET log_rotation_size = 0"
          docker restart "$DB_CONTAINER_ID"
          ready=false
          for _ in {1..60}; do
            if db_psql --command="SELECT 1" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "PostgreSQL did not become ready after restart" >&2
            dump_db_logs
            exit 1
          fi
          settings=$(db_psql \
            --tuples-only \
            --no-align \
            --command="SHOW fsync" \
            --command="SHOW synchronous_commit" \
            --command="SHOW full_page_writes" \
            --command="SHOW timescaledb.max_background_workers")
          if [[ "$settings" != $'off\noff\noff\n0' ]]; then
            printf 'PostgreSQL test settings do not match expectations:\n%s\n' "$settings" >&2
            dump_db_logs
            exit 1
          fi
          log_settings=$(db_psql \
            --tuples-only \
            --no-align \
            --command="SHOW logging_collector" \
            --command="SHOW log_destination" \
            --command="SHOW log_statement" \
            --command="SHOW log_parameter_max_length" \
            --command="SHOW log_rotation_age" \
            --command="SHOW log_rotation_size")
          if [[ "$log_settings" != $'on\njsonlog\nall\n-1\n0\n0' ]]; then
            printf 'PostgreSQL query logging settings do not match expectations:\n%s\n' "$log_settings" >&2
            dump_db_logs
            exit 1
          fi
          timescaledb_workers=$(db_psql \
            --tuples-only \
            --no-align \
            --command="SELECT count(*) FROM pg_stat_activity WHERE application_name LIKE '%TimescaleDB%'")
          if [[ "$timescaledb_workers" != "0" ]]; then
            printf 'TimescaleDB background workers are still running: %s\n' "$timescaledb_workers" >&2
            dump_db_logs
            exit 1
          fi

      - name: Configure Redis ACL for rate limit tests
        env:
          REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
        run: |
          set -euo pipefail
          docker exec "$REDIS_CONTAINER_ID" redis-cli ACL SETUSER \
            rate-limit-test reset on \
            '>test-password' '~t-rader:*' \
            +@connection +select +@scripting +get +set +pttl +time
          docker exec "$REDIS_CONTAINER_ID" redis-cli ACL SETUSER default reset off

      - name: Test Python exec wrapper
        run: python3 -m unittest backend/docker/python-exec/test_entrypoint.py

      - name: Regenerate backend query log with the pinned source tests
        id: backend-tests
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_test
          REDIS_URL: redis://rate-limit-test:test-password@localhost:6379/
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Capture regenerated PostgreSQL query log
        id: capture-query-log
        if: always()
        continue-on-error: true
        env:
          DB_CONTAINER_ID: ${{ job.services.db.id }}
        run: |
          set -euo pipefail
          QUERY_LOG_PATH="$RUNNER_TEMP/backend-query-log-regenerated/postgresql.json"

          db_psql() {
            docker exec "$DB_CONTAINER_ID" psql \
              --username=t_rader \
              --dbname=t_rader_test \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              "$@"
          }

          if ! log_path=$(db_psql --command="SELECT current_setting('data_directory') || '/' || pg_current_logfile('jsonlog')"); then
            echo "PostgreSQL query log path could not be read" >&2
            docker logs "$DB_CONTAINER_ID" || true
            exit 1
          fi
          if [[ -z "$log_path" ]]; then
            echo "PostgreSQL did not report an active JSON log file" >&2
            docker logs "$DB_CONTAINER_ID" || true
            exit 1
          fi

          mkdir -p "$(dirname "$QUERY_LOG_PATH")"
          if ! docker cp "$DB_CONTAINER_ID:$log_path" "$QUERY_LOG_PATH"; then
            echo "PostgreSQL query log could not be copied" >&2
            docker logs "$DB_CONTAINER_ID" || true
            exit 1
          fi

      - name: Upload regenerated backend query log
        id: upload-regenerated-log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-query-log-regenerated-${{ github.run_id }}
          path: ${{ runner.temp }}/backend-query-log-regenerated/postgresql.json
          if-no-files-found: warn
          retention-days: 1

      - name: Compare regenerated log to the hash-only reference
        id: input-comparison
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_test
          INPUT_ARTIFACT_NAME: backend-query-log-regenerated-${{ github.run_id }}
          INPUT_ARTIFACT_ID: ${{ steps.upload-regenerated-log.outputs.artifact-id }}
          QUERY_LOG_PATH: ${{ runner.temp }}/backend-query-log-regenerated/postgresql.json
        run: |
          set -euo pipefail
          input_dir="$CAPTURE_OUTPUT_DIR/input"
          mkdir -p "$input_dir"

          if [[ ! -s "$QUERY_LOG_PATH" ]]; then
            echo "matches=false" >> "$GITHUB_OUTPUT"
            jq -n \
              --arg kind "query_log_missing" \
              --arg detail "Regenerated PostgreSQL query log is missing or empty." \
              '{status: "failed", failure_kind: $kind, difference_count: 1, detail: $detail}' \
              > "$input_dir/failure.json"
            exit 1
          fi
          if [[ -z "$INPUT_ARTIFACT_ID" ]]; then
            echo "matches=false" >> "$GITHUB_OUTPUT"
            jq -n \
              --arg kind "query_log_artifact_missing" \
              --arg detail "Regenerated PostgreSQL query log artifact ID is unavailable." \
              '{status: "failed", failure_kind: $kind, difference_count: 1, detail: $detail}' \
              > "$input_dir/failure.json"
            exit 1
          fi

          command_status=0
          cargo run --locked --manifest-path backend/scripts/query-perf-input-manifest/Cargo.toml -- \
            build \
            --log-file "$QUERY_LOG_PATH" \
            --target-date 2026-10-22 \
            --source-checkout-sha "$SOURCE_CHECKOUT_SHA" \
            --input-kind ci-regenerated \
            --input-artifact-name "$INPUT_ARTIFACT_NAME" \
            --input-artifact-id "$INPUT_ARTIFACT_ID" \
            --exclusions-file backend/crates/apps/query-perf/exclusions.json \
            --output "$input_dir/regenerated-manifest.json" \
            --group-binds-output "$CAPTURE_OUTPUT_DIR/binds/source-binds.json" \
            --compare-to backend/scripts/query-perf-input-manifest/reference-manifest.json \
            --comparison-output "$input_dir/comparison.json" \
            --failure-output "$input_dir/failure.json" \
            > "$input_dir/comparison.stdout" \
            2> "$input_dir/comparison.stderr" || command_status=$?

          if ((command_status == 0)) && jq -e '.matches == true' "$input_dir/comparison.json" >/dev/null; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
            jq -n \
              --arg artifact_name "$INPUT_ARTIFACT_NAME" \
              --arg artifact_id "$INPUT_ARTIFACT_ID" \
              --arg input_log_sha256 "$(sha256sum "$QUERY_LOG_PATH" | cut -d ' ' -f 1)" \
              '{status: "passed", input_kind: "ci-regenerated", artifact_name: $artifact_name, artifact_id: $artifact_id, input_log_sha256: $input_log_sha256}' \
              > "$input_dir/result.json"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
            if [[ ! -s "$input_dir/failure.json" ]]; then
              jq -n \
                --arg kind "full_input_comparison_failed" \
                --arg detail "The full SQL, typed bind, or exclusion comparison did not pass." \
                --argjson command_status "$command_status" \
                '{status: "failed", failure_kind: $kind, difference_count: 1, command_status: $command_status, detail: $detail}' \
                > "$input_dir/failure.json"
            fi
            jq -n \
              --arg artifact_name "$INPUT_ARTIFACT_NAME" \
              --arg artifact_id "$INPUT_ARTIFACT_ID" \
              --arg input_log_sha256 "$(sha256sum "$QUERY_LOG_PATH" | cut -d ' ' -f 1)" \
              --argjson command_status "$command_status" \
              '{status: "failed", input_kind: "ci-regenerated", artifact_name: $artifact_name, artifact_id: $artifact_id, input_log_sha256: $input_log_sha256, command_status: $command_status}' \
              > "$input_dir/result.json"
            exit 1
          fi

      - name: Stop backend test services before starting the perf database
        if: always()
        env:
          DB_CONTAINER_ID: ${{ job.services.db.id }}
          REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
        run: |
          set -euo pipefail
          docker stop "$DB_CONTAINER_ID" "$REDIS_CONTAINER_ID" >/dev/null 2>&1 || true

      - name: Log in to GHCR
        id: ghcr-login
        if: >-
          steps.backend-tests.outcome == 'success' &&
          steps.capture-query-log.outcome == 'success' &&
          steps.upload-regenerated-log.outcome == 'success' &&
          steps.input-comparison.outcome == 'success' &&
          steps.input-comparison.outputs.matches == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Replay and capture query plans
        id: capture-plans
        if: >-
          steps.backend-tests.outcome == 'success' &&
          steps.capture-query-log.outcome == 'success' &&
          steps.upload-regenerated-log.outcome == 'success' &&
          steps.input-comparison.outcome == 'success' &&
          steps.input-comparison.outputs.matches == 'true' &&
          steps.ghcr-login.outcome == 'success'
        env:
          QUERY_LOG_FILE: ${{ runner.temp }}/backend-query-log-regenerated/postgresql.json
          INPUT_ARTIFACT_NAME: backend-query-log-regenerated-${{ github.run_id }}
          INPUT_ARTIFACT_ID: ${{ steps.upload-regenerated-log.outputs.artifact-id }}
          INPUT_MANIFEST_FILE: query-perf-plan-capture/input/regenerated-manifest.json
          INPUT_COMPARISON_FILE: query-perf-plan-capture/input/comparison.json
          CAPTURE_OUTPUT_DIR: query-perf-plan-capture
        run: backend/scripts/capture-query-perf-plan.sh

      - name: Remove any remaining perf DB container
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -Fxq 'query-perf-plan-capture-db'; then
            docker rm --force query-perf-plan-capture-db
          fi

      - name: Record why replay or plan capture was skipped
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.backend-tests.outcome }}
          LOG_CAPTURE_OUTCOME: ${{ steps.capture-query-log.outcome }}
          LOG_UPLOAD_OUTCOME: ${{ steps.upload-regenerated-log.outcome }}
          INPUT_COMPARISON_OUTCOME: ${{ steps.input-comparison.outcome }}
          INPUT_COMPARISON_MATCHES: ${{ steps.input-comparison.outputs.matches }}
          GHCR_LOGIN_OUTCOME: ${{ steps.ghcr-login.outcome }}
          PLAN_CAPTURE_OUTCOME: ${{ steps.capture-plans.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$CAPTURE_OUTPUT_DIR"
          jq -n \
            --arg tests "$TEST_OUTCOME" \
            --arg log_capture "$LOG_CAPTURE_OUTCOME" \
            --arg log_upload "$LOG_UPLOAD_OUTCOME" \
            --arg comparison "$INPUT_COMPARISON_OUTCOME" \
            --arg comparison_matches "$INPUT_COMPARISON_MATCHES" \
            --arg ghcr_login "$GHCR_LOGIN_OUTCOME" \
            --arg plan_capture "$PLAN_CAPTURE_OUTCOME" \
            '{backend_tests: $tests, log_capture: $log_capture, log_upload: $log_upload, input_comparison: $comparison, input_comparison_matches: $comparison_matches, ghcr_login: $ghcr_login, plan_capture: $plan_capture}' \
            > "$CAPTURE_OUTPUT_DIR/prerequisite-status.json"
          if [[ "$PLAN_CAPTURE_OUTCOME" == "skipped" ]]; then
            printf 'Replay and EXPLAIN were not run because a required prerequisite did not pass.\n' \
              > "$CAPTURE_OUTPUT_DIR/replay-skipped.txt"
          fi

      - name: Fail when test input validation or plan capture failed
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.backend-tests.outcome }}
          LOG_CAPTURE_OUTCOME: ${{ steps.capture-query-log.outcome }}
          LOG_UPLOAD_OUTCOME: ${{ steps.upload-regenerated-log.outcome }}
          INPUT_COMPARISON_OUTCOME: ${{ steps.input-comparison.outcome }}
          INPUT_COMPARISON_MATCHES: ${{ steps.input-comparison.outputs.matches }}
          GHCR_LOGIN_OUTCOME: ${{ steps.ghcr-login.outcome }}
          PLAN_CAPTURE_OUTCOME: ${{ steps.capture-plans.outcome }}
        run: |
          set -euo pipefail
          if [[ "$TEST_OUTCOME" != "success" \
            || "$LOG_CAPTURE_OUTCOME" != "success" \
            || "$LOG_UPLOAD_OUTCOME" != "success" \
            || "$INPUT_COMPARISON_OUTCOME" != "success" \
            || "$INPUT_COMPARISON_MATCHES" != "true" \
            || "$GHCR_LOGIN_OUTCOME" != "success" \
            || "$PLAN_CAPTURE_OUTCOME" != "success" ]]; then
            printf 'tests=%s log_capture=%s log_upload=%s input_comparison=%s input_matches=%s ghcr_login=%s plan_capture=%s\n' \
              "$TEST_OUTCOME" "$LOG_CAPTURE_OUTCOME" "$LOG_UPLOAD_OUTCOME" \
              "$INPUT_COMPARISON_OUTCOME" "$INPUT_COMPARISON_MATCHES" "$GHCR_LOGIN_OUTCOME" "$PLAN_CAPTURE_OUTCOME" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload query plans and diagnostic results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: query-perf-plan-capture-${{ github.run_id }}
          path: query-perf-plan-capture
          if-no-files-found: error
          retention-days: 14
