name: Query performance plan capture

on:
  push:
    branches:
      - fohte/query-perf-plan-capture-39714934810

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  capture-query-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Prepare artifact directory
        run: mkdir -p query-perf-plan-capture

      - run: rustup show

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.11

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download the source query log
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: 12399056019
          path: backend-query-log
          github-token: ${{ github.token }}
          repository: fohte/t-rader
          run-id: 39714934810

      - name: Replay and capture query plans
        run: backend/scripts/capture-query-perf-plan.sh

      - name: Remove the perf DB container
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | rg -x 'query-perf-plan-capture-db'; then
            docker rm --force query-perf-plan-capture-db
          fi

      - name: Upload raw plans and replay results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: query-perf-plan-capture-${{ github.run_id }}
          path: query-perf-plan-capture
          if-no-files-found: warn
          retention-days: 14
