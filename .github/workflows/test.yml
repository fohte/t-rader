name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'

    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: ${{ github.event.repository.name }}
          domain: octo-sts.fohte.net

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check if current commit is auto-format by bot
        id: check-auto-format
        run: |
          commit_message=$(git log -1 --format=%s)
          commit_author=$(git log -1 --format=%an)
          echo "Current commit message: $commit_message"
          echo "Current commit author: $commit_author"

          # Skip if the current commit is an auto-format commit by a bot
          # to prevent infinite loop: auto-format push -> CI -> auto-format push -> ...
          if [ "$commit_message" = "style: auto-format" ] && [[ "$commit_author" == *"[bot]"* ]]; then
            echo "skip_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if backend changes exist
        id: check-backend
        run: |
          if [[ "${{ needs.detect-changes.outputs.backend }}" == "true" || "${{ needs.detect-changes.outputs.workflow }}" == "true" ]]; then
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
          fi

      # sccache がインストールされない場合、RUSTC_WRAPPER=sccache が残っていると
      # mise の cargo ツールインストール時にビルドが失敗するため無効化する
      - name: Disable sccache wrapper (frontend-only)
        if: steps.check-backend.outputs.has_backend == 'false'
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"

      # Run rustup before mise-action to prevent race condition.
      # Multiple cargo: tools in mise.toml trigger parallel rustup component downloads,
      # causing "could not rename downloaded file" errors.
      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        if: steps.check-backend.outputs.has_backend == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Fetch cargo dependencies (backend)
        if: steps.check-backend.outputs.has_backend == 'true'
        run: cd "backend" && cargo fetch

      # eslint (lefthook) は全 workspace ファイルを対象に type-aware lint を行うため、
      # frontend の変更有無に関わらず routeTree.gen.ts が必要 (useParams 等の型は
      # そこでの module augmentation に依存する)。
      - name: Generate frontend route tree
        working-directory: frontend
        run: pnpm run generate:routes

      - name: Run lefthook
        id: lefthook
        continue-on-error: true
        env:
          # cargo-clippy は専用 job で実行するため、test job では常にスキップする
          LEFTHOOK_EXCLUDE: ${{ steps.check-backend.outputs.has_backend == 'false' && 'dump-openapi,openapi-typescript,cargo-fmt,cargo-clippy,ast-grep' || 'cargo-clippy' }}
          # pinact's min-age check calls the GitHub API; without a token it hits
          # the 60 req/h unauthenticated limit shared per IP and fails on CI.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lefthook run pre-commit --all-files

      # Formatters configured with `stage_fixed: true` run `git add` after formatting,
      # which stages the changes.
      # commit-action uses `git ls-files --modified` which only detects unstaged changes.
      # https://github.com/suzuki-shunsuke/commit-action/blob/87b297f0ce551411b43d1880f4fb3cbc60381055/action.yaml#L57
      # We need to unstage the changes so commit-action can detect them.
      - name: Unstage changes for commit-action
        run: git restore --staged .

      - name: Commit formatted files
        if: ${{ !cancelled() && steps.check-auto-format.outputs.skip_commit != 'true' }}
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        with:
          commit_message: 'style: auto-format'
          workflow: deny
          github_token: ${{ steps.octo-sts.outputs.token }}

      - name: Fail if lefthook failed
        if: steps.lefthook.outcome == 'failure'
        run: exit 1

  cargo-clippy:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup show

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11

      - name: Run cargo-clippy
        run: lefthook run pre-commit --all-files --command cargo-clippy

  detect-changes:
    runs-on: ubuntu-slim
    outputs:
      frontend: ${{ steps.changes-frontend.outputs.any_changed }}
      backend: ${{ steps.changes-backend.outputs.any_changed }}
      agent: ${{ steps.changes-agent.outputs.any_changed }}
      workflow: ${{ steps.changes-workflow.outputs.any_changed }}
      mise: ${{ steps.changes-mise.outputs.any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check for frontend changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-frontend
        with:
          files: frontend/**

      - name: Check for backend changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-backend
        with:
          files: backend/**

      - name: Check for agent changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-agent
        with:
          files: agent/**

      - name: Check for workflow changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-workflow
        with:
          files: .github/workflows/test.yml

      - name: Check for mise config changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-mise
        with:
          files: .mise.toml

  check-entity-sync:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.workflow == 'true' ||
      needs.detect-changes.outputs.mise == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_entity_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_entity_check
        run: cargo run -p migration -- up

      - name: Generate entities from database
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_entity_check
        run: bash scripts/generate-entities.sh

      - name: Check entity files are in sync
        working-directory: backend
        run: |
          if ! git diff --exit-code src/entities; then
            echo "::error::Entity files are out of sync with database schema."
            echo "Run 'bash backend/scripts/generate-entities.sh' locally and commit the changes."
            exit 1
          fi

  unit-test-frontend:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.agent == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # ~/.cache/ms-playwright の中身 (Chromium 本体等) は playwright パッケージの
      # バージョンにのみ依存するため、key は lockfile hash ではなくバージョンで切る。
      # Storybook の story は headless Playwright chromium 上で実行される。
      # actions/cache が保存するのは ~/.cache/ms-playwright (ブラウザ本体) のみで、
      # chromium に必要な OS 共有ライブラリ (apt パッケージ) はキャッシュ対象外のため、
      # キャッシュヒット時も install-deps で入れ直す必要がある。
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium

      # playwright install-deps は Chromium 実行に必要な OS 共有ライブラリのみを入れ、
      # 日本語などの CJK フォントは対象外。未インストールのままだと headless Chromium が
      # 日本語グリフを描画できず (tofu box)、graph edge label の実測幅がフォント依存で
      # ぶれて overflow-check が誤って揺れる原因になる。
      - name: Install CJK fonts for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run tests
        working-directory: frontend
        run: pnpm run test

  api-fuzzing-backend:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_api_fuzzing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Build backend
        working-directory: backend
        run: cargo build

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_api_fuzzing
        run: cargo run -p migration -- up

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_api_fuzzing
          BACKEND_PORT: '3000'
          RUST_LOG: info
          # 未設定だと agent-config 取得が失敗するため、CI 用のダミー値を設定
          STRATEGY_AGENT_MODEL: test-model
        run: |
          cargo run > /tmp/backend.log 2>&1 &
          # サーバーが起動するまで待機
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Backend server is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Backend server failed to start within 30 seconds"
              cat /tmp/backend.log || true
              exit 1
            fi
            sleep 1
          done

      # schemathesis/action は常に --checks=all を渡すため、backend/schemathesis.toml
      # の [checks] での enabled=false は上書きされ効かない。無効化対象を toml から
      # 読み取り、--exclude-checks として明示的に渡す。
      - name: Determine schemathesis checks to exclude
        id: schemathesis-checks
        working-directory: backend
        run: |
          args=$(python3 -c '
          import re
          import sys
          import tomllib

          with open("schemathesis.toml", "rb") as f:
              config = tomllib.load(f)
          checks = config.get("checks", {})
          names = [name for name, c in checks.items() if isinstance(c, dict) and c.get("enabled") is False]
          # schemathesis/action は args を eval で展開するため、TOML のキーを
          # 未検証のまま渡すとコマンドインジェクションになる。厳格な allowlist で弾く。
          for name in names:
              if not re.fullmatch(r"[A-Za-z0-9_]+", name):
                  print(f"::error::unexpected schemathesis check name: {name!r}", file=sys.stderr)
                  sys.exit(1)
          excluded = ",".join(names)
          print(f"--exclude-checks {excluded}" if names else "")
          ')
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Run Schemathesis API fuzzing
        uses: schemathesis/action@1f15936316e0742005bf69657b5909ac68f04cb3 # v2.1.0
        with:
          schema: http://localhost:3000/api-docs/openapi.json
          checks: all
          max-examples: 50
          config-file: backend/schemathesis.toml
          args: --workers 2 ${{ steps.schemathesis-checks.outputs.args }}
          # renovate: datasource=pypi depName=schemathesis
          version: 4.26.1

      - name: Dump backend log on failure
        if: failure()
        run: |
          echo "::group::backend.log"
          cat /tmp/backend.log || true
          echo "::endgroup::"

  unit-test-backend:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
      H8_STRESS_COUNT: '5'
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.11

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@50414676f9f5d50a65992c6dd2ed02641263226c # v2.82.10
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Tune PostgreSQL for backend tests
        env:
          DB_CONTAINER_ID: ${{ job.services.db.id }}
        run: |
          db_psql() {
            docker exec --env PGAPPNAME=ci-db-timing-setup "$DB_CONTAINER_ID" psql \
              --username=t_rader \
              --dbname=t_rader_test \
              --set=ON_ERROR_STOP=1 \
              "$@"
          }

          dump_db_logs() {
            echo "::group::PostgreSQL service logs"
            docker logs "$DB_CONTAINER_ID" || true
            echo "::endgroup::"
          }

          db_psql \
            --command="ALTER SYSTEM SET fsync = off" \
            --command="ALTER SYSTEM SET synchronous_commit = off" \
            --command="ALTER SYSTEM SET full_page_writes = off" \
            --command="ALTER SYSTEM SET timescaledb.max_background_workers = 0"
          docker restart "$DB_CONTAINER_ID"
          ready=false
          for _ in {1..60}; do
            if db_psql --command="SELECT 1" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "PostgreSQL did not become ready after restart" >&2
            dump_db_logs
            exit 1
          fi
          settings=$(db_psql \
            --tuples-only \
            --no-align \
            --command="SHOW fsync" \
            --command="SHOW synchronous_commit" \
            --command="SHOW full_page_writes" \
            --command="SHOW timescaledb.max_background_workers")
          if [[ "$settings" != $'off\noff\noff\n0' ]]; then
            printf 'PostgreSQL test settings do not match expectations:\n%s\n' "$settings" >&2
            dump_db_logs
            exit 1
          fi
          timescaledb_workers=$(db_psql \
            --tuples-only \
            --no-align \
            --command="SELECT count(*) FROM pg_stat_activity WHERE application_name LIKE '%TimescaleDB%'")
          if [[ "$timescaledb_workers" != "0" ]]; then
            printf 'TimescaleDB background workers are still running: %s\n' "$timescaledb_workers" >&2
            dump_db_logs
            exit 1
          fi

      - name: Prepare migrated database for transaction PoC
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_test
        run: cargo run -p migration -- up

      - name: Configure PostgreSQL for timing experiment
        env:
          DB_CONTAINER_ID: ${{ job.services.db.id }}
        run: |
          docker exec --env PGAPPNAME=ci-db-timing-setup "$DB_CONTAINER_ID" psql \
            --username=t_rader \
            --dbname=t_rader_test \
            --set=ON_ERROR_STOP=1 \
            --command="ALTER SYSTEM SET log_min_duration_statement = 0" \
            --command="ALTER SYSTEM SET log_connections = on" \
            --command="ALTER SYSTEM SET log_disconnections = on" \
            --command="ALTER SYSTEM SET log_line_prefix = '%m [%p] %a '" \
            --command="SELECT pg_reload_conf()"
          sleep 1
          docker exec --env PGAPPNAME=ci-db-timing-setup "$DB_CONTAINER_ID" psql \
            --username=t_rader \
            --dbname=t_rader_test \
            --set=ON_ERROR_STOP=1 \
            --command="SHOW log_min_duration_statement" \
            --command="SHOW fsync" \
            --command="SHOW synchronous_commit" \
            --command="SHOW full_page_writes" \
            --command="SHOW log_connections" \
            --command="SHOW log_disconnections" \
            --command="SHOW log_line_prefix"

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_test
          # 未設定だと該当機能の呼び出しが失敗するため、CI 用のダミー値を設定
          STRATEGY_AGENT_MODEL: test-model
          WEB_SEARCH_MODEL: test-web-search-model
          GEMINI_MEDIA_MODEL: gemini-9-flash
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Measure database-per-test baseline
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_test?application_name=h8-baseline
        run: |
          cargo llvm-cov nextest --no-report --stress-count "$H8_STRESS_COUNT" \
            --filterset 'test(=repositories::short_ratio::tests::upsert_inserts_new_records)' \
            --test-threads 1 --color never 2>&1 | tee h8-baseline-nextest.log

      - name: Measure transaction rollback PoC
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_test
        run: |
          cargo llvm-cov nextest --no-report --run-ignored ignored-only \
            --stress-count "$H8_STRESS_COUNT" \
            --filterset 'test(=repositories::short_ratio::tests::upsert_within_rolled_back_transaction_refactoring)' \
            --test-threads 1 --color never 2>&1 | tee h8-poc-nextest.log

      - name: Verify nested commit rollback
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_test
        run: >-
          cargo llvm-cov nextest --no-report --run-ignored ignored-only
          --filterset 'test(=services::note_kinds::tests::nested_create_commit_is_rolled_back_by_outer_transaction_refactoring)'
          --test-threads 1 --color never

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/lcov.info
          flags: backend
          fail_ci_if_error: false

      - name: Collect and summarize PostgreSQL statement and connection timings
        if: always()
        env:
          DB_CONTAINER_ID: ${{ job.services.db.id }}
        run: |
          docker logs "$DB_CONTAINER_ID" > backend-db.log 2>&1 || true
          python3 - <<'PY'
          import re
          import os
          from collections import defaultdict
          from datetime import datetime

          create_without_template = "CREATE DATABASE without TEMPLATE"
          create_with_template = "CREATE DATABASE with TEMPLATE"
          drop_database = "DROP DATABASE"
          advisory_lock = "pg_advisory_*"
          other_statements = "other statements"
          categories = (
              create_without_template,
              create_with_template,
              drop_database,
              advisory_lock,
              other_statements,
          )
          timing_pattern = re.compile(r"\bduration:\s*([0-9.]+)\s*ms\b", re.IGNORECASE)
          # Parse / Bind も別々に記録されるため、Execute と単純 query の statement だけを数える。
          statement_pattern = re.compile(
              r"\b(?:statement|execute(?:\s+[^:]+)?):\s*(.*)$", re.IGNORECASE
          )
          log_prefix_pattern = re.compile(
              r"^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)"
              r"\s+\S+\s+\[(?P<pid>\d+)\](?:\s+(?P<application_name>\S+))?"
          )
          connection_received_pattern = re.compile(r"\bconnection received:", re.IGNORECASE)
          ignored_connection_pattern = re.compile(
              r"\b(?:ci-db-timing-setup|pg_isready)\b"
          )
          connection_authorized_pattern = re.compile(
              r"\bconnection authorized:.*\bdatabase=(?P<database>\"[^\"]+\"|\S+)",
              re.IGNORECASE,
          )
          connection_application_name_pattern = re.compile(
              r"\bapplication_name=(?P<application_name>\"[^\"]+\"|\S+)",
              re.IGNORECASE,
          )
          session_time_pattern = re.compile(
              r"\bdisconnection: session time:\s*"
              r"(?P<hours>\d+):(?P<minutes>\d+):(?P<seconds>[0-9.]+)",
              re.IGNORECASE,
          )
          nextest_duration_pattern = re.compile(
              r"\bPASS\s+\[\s*(?P<duration>[0-9.]+)\s*(?P<unit>ms|s)\s*\]"
              r"\s+\[(?P<iteration>\d+)/(?P<total>\d+)\]"
          )
          totals = defaultdict(float)
          counts = defaultdict(int)
          maximums = defaultdict(float)
          connection_counts = defaultdict(int)
          connection_received_at = {}
          connection_auth_durations_ms = []
          connection_auth_durations_by_application = defaultdict(list)
          session_times_ms = []

          with open("backend-db.log", encoding="utf-8") as log:
              for line in log:
                  log_prefix = log_prefix_pattern.search(line)
                  timestamp = None
                  pid = None
                  prefix_application_name = ""
                  if log_prefix is not None:
                      timestamp = datetime.strptime(
                          log_prefix.group("timestamp"), "%Y-%m-%d %H:%M:%S.%f"
                      )
                      pid = log_prefix.group("pid")
                      prefix_application_name = log_prefix.group("application_name") or ""

                  if pid is not None and connection_received_pattern.search(line):
                      connection_received_at[pid] = timestamp

                  connection_authorized = connection_authorized_pattern.search(line)
                  if connection_authorized is not None:
                      received_at = connection_received_at.pop(pid, None)
                      application_name = connection_application_name_pattern.search(line)
                      application_name = (
                          application_name.group("application_name").strip('"')
                          if application_name is not None
                          else prefix_application_name
                      )
                      is_h8_connection = application_name.startswith("h8-")
                      if not ignored_connection_pattern.search(line):
                          database_name = connection_authorized.group("database").strip('"')
                          if database_name.startswith("_sqlx_test_"):
                              database_category = "sqlx test database"
                          elif database_name.startswith("t_rader_test_template_"):
                              database_category = "template database"
                          else:
                              database_category = "other databases"
                          if not is_h8_connection:
                              connection_counts[database_category] += 1

                          if received_at is not None:
                              duration_ms = (timestamp - received_at).total_seconds() * 1000
                              if not is_h8_connection:
                                  connection_auth_durations_ms.append(duration_ms)
                              if application_name:
                                  connection_auth_durations_by_application[
                                      application_name
                                  ].append(duration_ms)

                  session_time = session_time_pattern.search(line)
                  if (
                      session_time is not None
                      and not ignored_connection_pattern.search(line)
                      and not prefix_application_name.startswith("h8-")
                  ):
                      session_seconds = (
                          int(session_time.group("hours")) * 3600
                          + int(session_time.group("minutes")) * 60
                          + float(session_time.group("seconds"))
                      )
                      session_times_ms.append(session_seconds * 1000)

                  timing = timing_pattern.search(line)
                  statement = statement_pattern.search(line)
                  if (
                      timing is None
                      or statement is None
                      or prefix_application_name.startswith("h8-")
                      or ignored_connection_pattern.search(line)
                  ):
                      continue

                  query = statement.group(1).strip()
                  if re.match(r"(?:ALTER\s+SYSTEM\s+SET|SHOW)\b", query, re.IGNORECASE):
                      continue
                  if re.match(r"SELECT\s+pg_reload_conf\s*\(", query, re.IGNORECASE):
                      continue

                  if re.match(r"CREATE\s+DATABASE\b", query, re.IGNORECASE):
                      category = (
                          create_with_template
                          if re.search(r"\bTEMPLATE\b", query, re.IGNORECASE)
                          else create_without_template
                      )
                  elif re.match(r"DROP\s+DATABASE\b", query, re.IGNORECASE):
                      category = drop_database
                  elif re.search(r"\bpg_(?:try_)?advisory_[a-z_]+\s*\(", query, re.IGNORECASE):
                      category = advisory_lock
                  else:
                      category = other_statements

                  duration_ms = float(timing.group(1))
                  totals[category] += duration_ms
                  counts[category] += 1
                  maximums[category] = max(maximums[category], duration_ms)

          print("PostgreSQL statement timing summary (milliseconds)")
          print("category | count | total | average | max")
          for category in categories:
              count = counts[category]
              average = totals[category] / count if count else 0
              print(
                  f"{category} | {count} | {totals[category]:.3f} | "
                  f"{average:.3f} | {maximums[category]:.3f}"
              )

          connection_categories = (
              "sqlx test database",
              "template database",
              "other databases",
          )
          total_connections = sum(connection_counts.values())
          print("PostgreSQL connection counts")
          print("database category | count")
          print(f"total | {total_connections}")
          for category in connection_categories:
              print(f"{category} | {connection_counts[category]}")

          def print_duration_summary(title, values_ms):
              count = len(values_ms)
              total = sum(values_ms)
              average = total / count if count else 0
              print(f"{title} (milliseconds)")
              print("count | total | average")
              print(f"{count} | {total:.3f} | {average:.3f}")

          print_duration_summary(
              "PostgreSQL disconnection session time", session_times_ms
          )
          print_duration_summary(
              "PostgreSQL connection received-to-authorized time",
              connection_auth_durations_ms,
          )
          for application_name in sorted(connection_auth_durations_by_application):
              if application_name.startswith("h8-"):
                  print_duration_summary(
                      f"PostgreSQL received-to-authorized time ({application_name})",
                      connection_auth_durations_by_application[application_name],
                  )

          def read_nextest_durations(path, test_name):
              samples = []
              if not os.path.exists(path):
                  return samples
              with open(path, encoding="utf-8") as output:
                  for line in output:
                      if test_name not in line:
                          continue
                      match = nextest_duration_pattern.search(line)
                      if match is None:
                          continue
                      value = float(match.group("duration"))
                      duration_ms = value * (1000 if match.group("unit") == "s" else 1)
                      samples.append(duration_ms)
              return samples

          expected_stress_count = int(os.environ["H8_STRESS_COUNT"])
          baseline_test_name = "repositories::short_ratio::tests::upsert_inserts_new_records"
          poc_test_name = "repositories::short_ratio::tests::upsert_within_rolled_back_transaction_refactoring"
          baseline_test_durations = read_nextest_durations(
              "backend/h8-baseline-nextest.log", baseline_test_name
          )
          poc_test_durations = read_nextest_durations(
              "backend/h8-poc-nextest.log", poc_test_name
          )

          def print_test_duration_summary(title, values_ms):
              count = len(values_ms)
              total = sum(values_ms)
              average = total / count if count else 0
              maximum = max(values_ms) if values_ms else 0
              print(f"{title} (milliseconds)")
              print("count | total | average | max")
              print(f"{count} | {total:.3f} | {average:.3f} | {maximum:.3f}")

          print_test_duration_summary(
              "H8 database-per-test baseline nextest test duration",
              baseline_test_durations,
          )
          print_test_duration_summary(
              "H8 rollback PoC nextest test duration",
              poc_test_durations,
          )
          baseline_auth = connection_auth_durations_by_application["h8-baseline"]
          if len(baseline_test_durations) == expected_stress_count and baseline_auth:
              print(
                  "H8 database-per-test baseline authentication time per test "
                  f"(all connections): {sum(baseline_auth) / len(baseline_test_durations):.3f} ms"
              )
          else:
              print(
                  "::warning::H8 baseline authentication average unavailable: "
                  f"tests={len(baseline_test_durations)}/{expected_stress_count}, "
                  f"connections={len(baseline_auth)}"
              )

          poc_primary_auth = connection_auth_durations_by_application["h8-poc-primary"]
          poc_verifier_auth = connection_auth_durations_by_application["h8-poc-verify"]
          if (
              len(poc_test_durations) == expected_stress_count
              and len(poc_primary_auth) == expected_stress_count
              and len(poc_verifier_auth) == expected_stress_count
          ):
              print(
                  "H8 rollback PoC authentication time per test: "
                  f"primary={sum(poc_primary_auth) / expected_stress_count:.3f} ms, "
                  f"verification={sum(poc_verifier_auth) / expected_stress_count:.3f} ms, "
                  f"combined={(sum(poc_primary_auth) + sum(poc_verifier_auth)) / expected_stress_count:.3f} ms "
                  f"({len(poc_primary_auth) + len(poc_verifier_auth)} connections)"
              )
          else:
              print(
                  "::warning::H8 rollback PoC authentication average unavailable: "
                  f"tests={len(poc_test_durations)}/{expected_stress_count}, "
                  f"primary={len(poc_primary_auth)}, verification={len(poc_verifier_auth)}"
              )
          PY

      - name: Upload PostgreSQL server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-db-log
          path: backend-db.log
          if-no-files-found: warn

  unit-test-agent:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.agent == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.9.11

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: agent
        env:
          TEST_DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_agent_test
        run: pnpm run test

      - name: Build agent bundle
        working-directory: agent
        run: pnpm run build

      # src を退避して runtime イメージ (dist + drizzle のみ) を再現する。
      # src が残っていると Node の型ストリップが #foo 形式の subpath
      # imports を .ts のまま読めてしまい、dist に external のまま残る
      # regression を検知できない。
      # 必須 env 未設定のまま実行し、bootstrap 段階の env 検証エラーで
      # 早期終了することを利用して HTTP サーバー等の起動は避けるが、
      # その前提が崩れて起動し続けた場合に備えて timeout も設定する。
      - name: Verify bundle has no unresolved subpath imports
        working-directory: agent
        timeout-minutes: 2
        run: |
          mv src /tmp/agent-src-backup
          trap 'mv /tmp/agent-src-backup src' EXIT
          # dist 直下のエントリファイル (tsup の共有 chunk-*.js を除く) を
          # 対象にする。tsup.config.ts の entry や package.json の build
          # script にエントリが増減しても追従する。
          while IFS= read -r entry; do
            output=$(node "$entry" 2>&1 || true)
            if echo "$output" | grep -q ERR_MODULE_NOT_FOUND; then
              echo "$output"
              echo "::error::$entry has an unresolved subpath import"
              exit 1
            fi
          done < <(find dist -name '*.js' -not -name 'chunk-*')

  # package 別 job 名を branch protection の required check に指定できないため、固定名の gate を使う。
  # テスト、entity 同期、API fuzzing、knip、cargo-clippy の失敗を集約し、失敗がなければ skip する。
  # required check の skip は成功として扱われる。
  unit-test:
    runs-on: ubuntu-slim
    needs:
      - detect-changes
      - check-entity-sync
      - api-fuzzing-backend
      - cargo-clippy
      - unit-test-frontend
      - unit-test-backend
      - unit-test-agent
      - knip
    if: failure()
    steps:
      - run: exit 1

  knip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      # #routeTree.gen は gitignore 対象で生成するまで存在せず、knip の
      # unresolved-imports チェックがこれを解決できないため先に生成する
      - name: Generate frontend routes
        run: pnpm --filter frontend run generate:routes

      - name: Run knip
        run: pnpm exec knip
