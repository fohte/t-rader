name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}

jobs:
  test:
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'

    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: ${{ github.event.repository.name }}
          domain: octo-sts.fohte.net

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check if current commit is auto-format by bot
        id: check-auto-format
        run: |
          commit_message=$(git log -1 --format=%s)
          commit_author=$(git log -1 --format=%an)
          echo "Current commit message: $commit_message"
          echo "Current commit author: $commit_author"

          # Skip if the current commit is an auto-format commit by a bot
          # to prevent infinite loop: auto-format push -> CI -> auto-format push -> ...
          if [ "$commit_message" = "style: auto-format" ] && [[ "$commit_author" == *"[bot]"* ]]; then
            echo "skip_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if backend changes exist
        id: check-backend
        run: |
          if [[ "${{ needs.detect-changes.outputs.backend }}" == "true" || "${{ needs.detect-changes.outputs.workflow }}" == "true" ]]; then
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for database documentation changes
        id: db-doc-changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            backend/migration/**
            agent/drizzle/**
            **/.tbls.yml
            scripts/db-*
            compose*.yaml
            .mise.toml
            **/.mise.toml
            .github/workflows/test.yml

      - name: Setup Go for generated API client
        if: steps.check-backend.outputs.has_backend == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: terraform-provider/go.mod
          cache-dependency-path: terraform-provider/go.sum

      # sccache がインストールされない場合、RUSTC_WRAPPER=sccache が残っていると
      # mise の cargo ツールインストール時にビルドが失敗するため無効化する
      - name: Disable sccache wrapper (frontend-only)
        if: steps.check-backend.outputs.has_backend == 'false' && steps.db-doc-changes.outputs.any_modified != 'true'
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"

      # Run rustup before mise-action to prevent race condition.
      # Multiple cargo: tools in mise.toml trigger parallel rustup component downloads,
      # causing "could not rename downloaded file" errors.
      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        if: steps.check-backend.outputs.has_backend == 'true' || steps.db-doc-changes.outputs.any_modified == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Fetch cargo dependencies (backend)
        if: steps.check-backend.outputs.has_backend == 'true'
        run: cd "backend" && cargo fetch

      # eslint (lefthook) は全 workspace ファイルを対象に type-aware lint を行うため、
      # frontend の変更有無に関わらず routeTree.gen.ts が必要 (useParams 等の型は
      # そこでの module augmentation に依存する)。
      - name: Generate frontend route tree
        working-directory: frontend
        run: pnpm run generate:routes

      - name: Verify database bootstrap
        if: steps.db-doc-changes.outputs.any_modified == 'true'
        run: |
          mise run db:up
          mise run db:up

          actual_databases=$(docker compose exec -T db psql \
            --username t_rader \
            --dbname postgres \
            --tuples-only \
            --no-align \
            --command "SELECT datname FROM pg_database WHERE NOT datistemplate AND datname <> 'postgres' ORDER BY datname")
          expected_databases=$(cat <<'EXPECTED'
          t_rader
          t_rader_agent_dev
          t_rader_agent_test
          t_rader_backend_dev
          t_rader_backend_test
          EXPECTED
          )

          if [[ "$actual_databases" != "$expected_databases" ]]; then
            printf 'Expected databases:\n%s\nActual databases:\n%s\n' "$expected_databases" "$actual_databases"
            exit 1
          fi

          for package in backend agent; do
            case "$package" in
              backend) expected_package_databases=$(printf 't_rader_backend_dev\nt_rader_backend_test') ;;
              agent) expected_package_databases=$(printf 't_rader_agent_dev\nt_rader_agent_test') ;;
            esac
            actual_package_databases=$(cd "$package" && mise exec -- sh -c "printf '%s\\n%s' \"\${DATABASE_URL##*/}\" \"\${TEST_DATABASE_URL##*/}\"")
            if [[ "$actual_package_databases" != "$expected_package_databases" ]]; then
              printf 'Unexpected default databases for %s:\n%s\n' "$package" "$actual_package_databases"
              exit 1
            fi

            expected_explicit_urls=$(printf 'postgresql://example.invalid/%s_dev\npostgresql://example.invalid/%s_test' "$package" "$package")
            actual_explicit_urls=$(cd "$package" && DATABASE_URL="postgresql://example.invalid/${package}_dev" TEST_DATABASE_URL="postgresql://example.invalid/${package}_test" mise exec -- sh -c "printf '%s\\n%s' \"\$DATABASE_URL\" \"\$TEST_DATABASE_URL\"")
            if [[ "$actual_explicit_urls" != "$expected_explicit_urls" ]]; then
              printf 'mise overrode explicit database URLs for %s:\n%s\n' "$package" "$actual_explicit_urls"
              exit 1
            fi
          done

      - name: Generate database documentation
        if: steps.db-doc-changes.outputs.any_modified == 'true'
        run: mise run db:doc

      - name: Stage generated database documentation
        if: steps.db-doc-changes.outputs.any_modified == 'true'
        run: git add -- backend/docs/db agent/docs/db

      - name: Run lefthook
        id: lefthook
        continue-on-error: true
        env:
          # cargo-clippy は専用 job で実行するため、test job では常にスキップする
          LEFTHOOK_EXCLUDE: ${{ steps.check-backend.outputs.has_backend == 'false' && 'dump-openapi,openapi-typescript,openapi-go-client,cargo-fmt,cargo-clippy,ast-grep,go-fmt,go-vet' || 'cargo-clippy,go-fmt,go-vet' }}
          # pinact's min-age check calls the GitHub API; without a token it hits
          # the 60 req/h unauthenticated limit shared per IP and fails on CI.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lefthook run pre-commit --all-files

      - name: Build Terraform provider after OpenAPI generation
        if: steps.check-backend.outputs.has_backend == 'true'
        working-directory: terraform-provider
        run: go build ./...

      # Formatters configured with `stage_fixed: true` run `git add` after formatting,
      # which stages the changes.
      # commit-action uses `git ls-files --modified` which only detects unstaged changes.
      # https://github.com/suzuki-shunsuke/commit-action/blob/87b297f0ce551411b43d1880f4fb3cbc60381055/action.yaml#L57
      # We need to unstage the changes so commit-action can detect them.
      - name: Unstage changes for commit-action
        run: git restore --staged .

      - name: Commit formatted files
        if: ${{ !cancelled() && steps.check-auto-format.outputs.skip_commit != 'true' }}
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        with:
          commit_message: 'style: auto-format'
          workflow: deny
          github_token: ${{ steps.octo-sts.outputs.token }}

      - name: Fail if lefthook failed
        if: steps.lefthook.outcome == 'failure'
        run: exit 1

  cargo-clippy:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup show

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11

      - name: Check entrypoint crate dependencies
        run: bash backend/scripts/check-entrypoint-dependencies.sh

      - name: Run cargo-clippy
        run: lefthook run pre-commit --all-files --command cargo-clippy

  terraform-provider:
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform_provider == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: terraform-provider/go.mod
          cache-dependency-path: terraform-provider/go.sum

      - name: Check generated Go API client
        run: ../scripts/generate-terraform-api-client && git diff --exit-code -- internal/traderapi/gen/client.gen.go
        working-directory: terraform-provider

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install_args: lefthook

      - name: Run Go format and vet checks through lefthook
        run: lefthook run pre-commit --all-files --command go-fmt --command go-vet

      - name: Run Go tests
        working-directory: terraform-provider
        run: go test ./...

  detect-changes:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    outputs:
      frontend: ${{ steps.changes-frontend.outputs.any_changed }}
      backend: ${{ steps.changes-backend.outputs.any_changed }}
      agent: ${{ steps.changes-agent.outputs.any_changed }}
      workflow: ${{ steps.changes-workflow.outputs.any_changed }}
      mise: ${{ steps.changes-mise.outputs.any_modified }}
      terraform_provider: ${{ steps.changes-terraform-provider.outputs.any_modified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check for frontend changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-frontend
        with:
          files: frontend/**

      - name: Check for backend changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-backend
        with:
          files: backend/**

      - name: Check for agent changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-agent
        with:
          files: agent/**

      - name: Check for workflow changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-workflow
        with:
          files: .github/workflows/test.yml

      - name: Check for mise config changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-mise
        with:
          files: .mise.toml

      - name: Check for Terraform provider changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-terraform-provider
        with:
          files: |
            terraform-provider/**
            backend/openapi.json
            .github/workflows/test.yml
            lefthook.yml

  check-entity-sync:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.workflow == 'true' ||
      needs.detect-changes.outputs.mise == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
    services:
      db:
        image: timescale/timescaledb:2.26.4-pg18@sha256:9ecddf2c88356f01f2986a0349ea525a5f7c56b81935bbfd58e9590c93f7d859
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_entity_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_entity_check
        run: cargo run -p migration -- up

      - name: Generate entities from database
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_entity_check
        run: bash scripts/generate-entities.sh

      - name: Check entity files are in sync
        working-directory: backend
        run: |
          if ! git diff --exit-code crates/gateways/postgres/src/entities; then
            echo "::error::Entity files are out of sync with database schema."
            echo "Run 'bash backend/scripts/generate-entities.sh' locally and commit the changes."
            exit 1
          fi

  unit-test-frontend:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.agent == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # ~/.cache/ms-playwright の中身 (Chromium 本体等) は playwright パッケージの
      # バージョンにのみ依存するため、key は lockfile hash ではなくバージョンで切る。
      # Storybook の story は headless Playwright chromium 上で実行される。
      # actions/cache が保存するのは ~/.cache/ms-playwright (ブラウザ本体) のみで、
      # chromium に必要な OS 共有ライブラリ (apt パッケージ) はキャッシュ対象外のため、
      # キャッシュヒット時も install-deps で入れ直す必要がある。
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium

      # playwright install-deps は Chromium 実行に必要な OS 共有ライブラリのみを入れ、
      # 日本語などの CJK フォントは対象外。未インストールのままだと headless Chromium が
      # 日本語グリフを描画できず (tofu box)、graph edge label の実測幅がフォント依存で
      # ぶれて overflow-check が誤って揺れる原因になる。
      - name: Install CJK fonts for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run tests
        working-directory: frontend
        run: pnpm run test

  api-fuzzing-backend:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.workflow == 'true' ||
      needs.detect-changes.outputs.terraform_provider == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
    services:
      db:
        image: timescale/timescaledb:2.26.4-pg18@sha256:9ecddf2c88356f01f2986a0349ea525a5f7c56b81935bbfd58e9590c93f7d859
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_api_fuzzing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Build backend
        working-directory: backend
        run: cargo build

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_api_fuzzing
        run: cargo run -p migration -- up

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_api_fuzzing
          BACKEND_PORT: '3000'
          RUST_LOG: info
        run: |
          cargo run -p backend > /tmp/backend.log 2>&1 &
          # サーバーが起動するまで待機
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Backend server is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Backend server failed to start within 30 seconds"
              cat /tmp/backend.log || true
              exit 1
            fi
            sleep 1
          done

      - name: Setup Go for Terraform provider integration
        if: needs.detect-changes.outputs.terraform_provider == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: terraform-provider/go.mod
          cache-dependency-path: terraform-provider/go.sum

      - name: Setup Terraform for provider integration
        if: needs.detect-changes.outputs.terraform_provider == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Run Terraform dev_overrides lifecycle
        if: needs.detect-changes.outputs.terraform_provider == 'true'
        working-directory: terraform-provider
        env:
          BACKEND_URL: http://localhost:3000
        run: |
          mkdir -p "$RUNNER_TEMP/trader-provider"
          go build -o "$RUNNER_TEMP/trader-provider/terraform-provider-trader" .
          bash ./scripts/test-dev-overrides.sh "$RUNNER_TEMP/trader-provider"

      # schemathesis/action は常に --checks=all を渡すため、backend/schemathesis.toml
      # の [checks] での enabled=false は上書きされ効かない。無効化対象を toml から
      # 読み取り、--exclude-checks として明示的に渡す。
      - name: Determine schemathesis checks to exclude
        if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflow == 'true'
        id: schemathesis-checks
        working-directory: backend
        run: |
          args=$(python3 -c '
          import re
          import sys
          import tomllib

          with open("schemathesis.toml", "rb") as f:
              config = tomllib.load(f)
          checks = config.get("checks", {})
          names = [name for name, c in checks.items() if isinstance(c, dict) and c.get("enabled") is False]
          # schemathesis/action は args を eval で展開するため、TOML のキーを
          # 未検証のまま渡すとコマンドインジェクションになる。厳格な allowlist で弾く。
          for name in names:
              if not re.fullmatch(r"[A-Za-z0-9_]+", name):
                  print(f"::error::unexpected schemathesis check name: {name!r}", file=sys.stderr)
                  sys.exit(1)
          excluded = ",".join(names)
          print(f"--exclude-checks {excluded}" if names else "")
          ')
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Run Schemathesis API fuzzing
        if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflow == 'true'
        uses: schemathesis/action@1f15936316e0742005bf69657b5909ac68f04cb3 # v2.1.0
        with:
          schema: http://localhost:3000/api-docs/openapi.json
          checks: all
          max-examples: 50
          config-file: backend/schemathesis.toml
          args: --workers 2 ${{ steps.schemathesis-checks.outputs.args }}
          # renovate: datasource=pypi depName=schemathesis
          version: 4.26.1

      - name: Dump backend log on failure
        if: failure()
        run: |
          echo "::group::backend.log"
          cat /tmp/backend.log || true
          echo "::endgroup::"

  unit-test-backend:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
    services:
      db:
        image: timescale/timescaledb:2.26.4-pg18@sha256:9ecddf2c88356f01f2986a0349ea525a5f7c56b81935bbfd58e9590c93f7d859
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.11

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Tune PostgreSQL for backend tests
        env:
          DB_CONTAINER_ID: ${{ job.services.db.id }}
        run: |
          db_psql() {
            docker exec "$DB_CONTAINER_ID" psql \
              --username=t_rader \
              --dbname=t_rader_test \
              --set=ON_ERROR_STOP=1 \
              "$@"
          }

          dump_db_logs() {
            echo "::group::PostgreSQL service logs"
            docker logs "$DB_CONTAINER_ID" || true
            docker exec "$DB_CONTAINER_ID" sh -c '
              for log_file in "$PGDATA"/log/*.json; do
                [ -f "$log_file" ] || continue
                cat "$log_file"
              done
            ' || true
            echo "::endgroup::"
          }

          db_psql \
            --command="ALTER SYSTEM SET fsync = off" \
            --command="ALTER SYSTEM SET synchronous_commit = off" \
            --command="ALTER SYSTEM SET full_page_writes = off" \
            --command="ALTER SYSTEM SET timescaledb.max_background_workers = 0" \
            --command="ALTER SYSTEM SET logging_collector = on" \
            --command="ALTER SYSTEM SET log_destination = 'jsonlog'" \
            --command="ALTER SYSTEM SET log_statement = 'all'" \
            --command="ALTER SYSTEM SET log_parameter_max_length = -1" \
            --command="ALTER SYSTEM SET log_rotation_age = 0" \
            --command="ALTER SYSTEM SET log_rotation_size = 0"
          docker restart "$DB_CONTAINER_ID"
          ready=false
          for _ in {1..60}; do
            if db_psql --command="SELECT 1" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "PostgreSQL did not become ready after restart" >&2
            dump_db_logs
            exit 1
          fi
          settings=$(db_psql \
            --tuples-only \
            --no-align \
            --command="SHOW fsync" \
            --command="SHOW synchronous_commit" \
            --command="SHOW full_page_writes" \
            --command="SHOW timescaledb.max_background_workers")
          if [[ "$settings" != $'off\noff\noff\n0' ]]; then
            printf 'PostgreSQL test settings do not match expectations:\n%s\n' "$settings" >&2
            dump_db_logs
            exit 1
          fi
          log_settings=$(db_psql \
            --tuples-only \
            --no-align \
            --command="SHOW logging_collector" \
            --command="SHOW log_destination" \
            --command="SHOW log_statement" \
            --command="SHOW log_parameter_max_length" \
            --command="SHOW log_rotation_age" \
            --command="SHOW log_rotation_size")
          if [[ "$log_settings" != $'on\njsonlog\nall\n-1\n0\n0' ]]; then
            printf 'PostgreSQL query logging settings do not match expectations:\n%s\n' "$log_settings" >&2
            dump_db_logs
            exit 1
          fi
          timescaledb_workers=$(db_psql \
            --tuples-only \
            --no-align \
            --command="SELECT count(*) FROM pg_stat_activity WHERE application_name LIKE '%TimescaleDB%'")
          if [[ "$timescaledb_workers" != "0" ]]; then
            printf 'TimescaleDB background workers are still running: %s\n' "$timescaledb_workers" >&2
            dump_db_logs
            exit 1
          fi

      - name: Configure Redis ACL for rate limit tests
        env:
          REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
        run: |
          docker exec "$REDIS_CONTAINER_ID" redis-cli ACL SETUSER \
            rate-limit-test reset on \
            '>test-password' '~t-rader:*' \
            +@connection +select +@scripting +get +set +pttl +time
          docker exec "$REDIS_CONTAINER_ID" redis-cli ACL SETUSER default reset off

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_test
          REDIS_URL: redis://rate-limit-test:test-password@localhost:6379/
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Capture PostgreSQL query log
        if: always()
        env:
          DB_CONTAINER_ID: ${{ job.services.db.id }}
          QUERY_LOG_PATH: ${{ runner.temp }}/backend-query-log/postgresql.json
        run: |
          db_psql() {
            docker exec "$DB_CONTAINER_ID" psql \
              --username=t_rader \
              --dbname=t_rader_test \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              "$@"
          }

          log_path=$(db_psql --command="SELECT current_setting('data_directory') || '/' || pg_current_logfile('jsonlog')")
          if [[ -z "$log_path" ]]; then
            echo "PostgreSQL did not report an active JSON log file" >&2
            docker logs "$DB_CONTAINER_ID"
            exit 1
          fi

          mkdir -p "$(dirname "$QUERY_LOG_PATH")"
          docker cp "$DB_CONTAINER_ID:$log_path" "$QUERY_LOG_PATH"

      - name: Upload PostgreSQL query log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-query-log
          path: ${{ runner.temp }}/backend-query-log/postgresql.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/lcov.info
          flags: backend
          fail_ci_if_error: false

  query-perf:
    needs: unit-test-backend
    if: needs.unit-test-backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      CARGO_INCREMENTAL: '0'
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup show

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.11

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download backend query log
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-query-log
          path: backend-query-log

      - name: Build query performance runner
        run: cargo build --manifest-path backend/Cargo.toml -p query-perf

      - name: Pull or build perf DB image
        id: perf-db-image
        run: |
          image_ref=$(backend/scripts/build-perf-db-image.sh --image-ref)
          if manifest_output=$(docker manifest inspect "$image_ref" 2>&1); then
            docker pull "$image_ref"
          else
            case "$manifest_output" in
              *'no such manifest'* | *'manifest unknown'* | *'404 Not Found'*)
                echo "Perf DB image is missing; building it locally."
                backend/scripts/build-perf-db-image.sh
                ;;
              *)
                printf 'Failed to inspect perf DB image %s:\n%s\n' "$image_ref" "$manifest_output" >&2
                exit 1
                ;;
            esac
          fi
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Start memory-limited perf DB
        run: |
          docker run \
            --detach \
            --name query-perf-db \
            --restart=on-failure:5 \
            --memory=6g \
            --memory-swap=6g \
            --publish 127.0.0.1:5432:5432 \
            "${{ steps.perf-db-image.outputs.image_ref }}"

      - name: Wait for perf DB
        run: |
          ready=false
          for _ in {1..120}; do
            if docker exec query-perf-db pg_isready --username=t_rader --dbname=t_rader; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker logs query-perf-db
            exit 1
          fi

      - name: Replay backend SELECT queries
        env:
          DATABASE_URL: postgres://t_rader:t_rader@127.0.0.1:5432/t_rader
        run: cargo run --manifest-path backend/Cargo.toml -p query-perf -- --log-file backend-query-log/postgresql.json

      - name: Remove perf DB container
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | rg -x 'query-perf-db'; then
            docker rm --force query-perf-db
          fi

  unit-test-agent:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.agent == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.26.4-pg18@sha256:9ecddf2c88356f01f2986a0349ea525a5f7c56b81935bbfd58e9590c93f7d859
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.9.11

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: agent
        env:
          TEST_DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_agent_test
        run: pnpm run test

      - name: Build agent bundle
        working-directory: agent
        run: pnpm run build

      # src を退避して runtime イメージ (dist + drizzle のみ) を再現する。
      # src が残っていると Node の型ストリップが #foo 形式の subpath
      # imports を .ts のまま読めてしまい、dist に external のまま残る
      # regression を検知できない。
      # 必須 env 未設定のまま実行し、bootstrap 段階の env 検証エラーで
      # 早期終了することを利用して HTTP サーバー等の起動は避けるが、
      # その前提が崩れて起動し続けた場合に備えて timeout も設定する。
      - name: Verify bundle has no unresolved subpath imports
        working-directory: agent
        timeout-minutes: 2
        run: |
          mv src /tmp/agent-src-backup
          trap 'mv /tmp/agent-src-backup src' EXIT
          # dist 直下のエントリファイル (tsup の共有 chunk-*.js を除く) を
          # 対象にする。tsup.config.ts の entry や package.json の build
          # script にエントリが増減しても追従する。
          while IFS= read -r entry; do
            output=$(node "$entry" 2>&1 || true)
            if echo "$output" | grep -q ERR_MODULE_NOT_FOUND; then
              echo "$output"
              echo "::error::$entry has an unresolved subpath import"
              exit 1
            fi
          done < <(find dist -name '*.js' -not -name 'chunk-*')

  # package 別 job 名を branch protection の required check に指定できないため、固定名の gate を使う。
  # required check の skip は成功として扱われる。
  unit-test:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    needs:
      - detect-changes
      - check-entity-sync
      - api-fuzzing-backend
      - cargo-clippy
      - terraform-provider
      - unit-test-frontend
      - unit-test-backend
      - query-perf
      - unit-test-agent
      - knip
    if: failure()
    steps:
      - run: exit 1

  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      # #routeTree.gen は gitignore 対象で生成するまで存在せず、knip の
      # unresolved-imports チェックがこれを解決できないため先に生成する
      - name: Generate frontend routes
        run: pnpm --filter frontend run generate:routes

      - name: Run knip
        env:
          DATABASE_URL: postgresql://example.invalid/agent_dev
        run: pnpm exec knip

      - name: Run knip in production mode
        env:
          DATABASE_URL: postgresql://example.invalid/agent_dev
        run: pnpm exec knip --production
