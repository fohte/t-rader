name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'

    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: fohte
          identity: ${{ github.event.repository.name }}
          domain: octo-sts.fohte.net

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check if current commit is auto-format by bot
        id: check-auto-format
        run: |
          commit_message=$(git log -1 --format=%s)
          commit_author=$(git log -1 --format=%an)
          echo "Current commit message: $commit_message"
          echo "Current commit author: $commit_author"

          # Skip if the current commit is an auto-format commit by a bot
          # to prevent infinite loop: auto-format push -> CI -> auto-format push -> ...
          if [ "$commit_message" = "style: auto-format" ] && [[ "$commit_author" == *"[bot]"* ]]; then
            echo "skip_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if backend changes exist
        id: check-backend
        run: |
          if [[ "${{ needs.detect-changes.outputs.backend }}" == "true" || "${{ needs.detect-changes.outputs.workflow }}" == "true" ]]; then
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
          fi

      # sccache がインストールされない場合、RUSTC_WRAPPER=sccache が残っていると
      # mise の cargo ツールインストール時にビルドが失敗するため無効化する
      - name: Disable sccache wrapper (frontend-only)
        if: steps.check-backend.outputs.has_backend == 'false'
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"

      # Run rustup before mise-action to prevent race condition.
      # Multiple cargo: tools in mise.toml trigger parallel rustup component downloads,
      # causing "could not rename downloaded file" errors.
      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        if: steps.check-backend.outputs.has_backend == 'true'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13

      - run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml', 'agent/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies (frontend)
        run: cd "frontend" && pnpm install --frozen-lockfile

      # TanStack Router の routeTree.gen.ts は gitignore 対象。
      # eslint の型ベースルール (no-unsafe-member-access 等) は route の generic 型に依存するため、
      # lint 前に生成しておかないと CI のみ false-positive が出る。
      - name: Generate frontend route tree
        run: cd "frontend" && pnpm exec tsr generate

      - name: Install pnpm dependencies (agent)
        run: cd "agent" && pnpm install --frozen-lockfile

      - name: Check peer dependencies (frontend)
        run: cd "frontend" && pnpm peers check

      - name: Check peer dependencies (agent)
        run: cd "agent" && pnpm peers check

      - name: Fetch cargo dependencies (backend)
        if: steps.check-backend.outputs.has_backend == 'true'
        run: cd "backend" && cargo fetch

      - name: Run lefthook
        id: lefthook
        continue-on-error: true
        env:
          # バックエンド変更がない場合、OpenAPI ダンプやバックエンド専用コマンドをスキップする
          LEFTHOOK_EXCLUDE: ${{ steps.check-backend.outputs.has_backend == 'false' && 'dump-openapi,openapi-typescript,cargo-fmt,cargo-clippy,ast-grep' || '' }}
          # pinact's min-age check calls the GitHub API; without a token it hits
          # the 60 req/h unauthenticated limit shared per IP and fails on CI.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lefthook run pre-commit --all-files

      # Formatters configured with `stage_fixed: true` run `git add` after formatting,
      # which stages the changes.
      # commit-action uses `git ls-files --modified` which only detects unstaged changes.
      # https://github.com/suzuki-shunsuke/commit-action/blob/87b297f0ce551411b43d1880f4fb3cbc60381055/action.yaml#L57
      # We need to unstage the changes so commit-action can detect them.
      - name: Unstage changes for commit-action
        run: git restore --staged .

      - name: Commit formatted files
        if: ${{ !cancelled() && steps.check-auto-format.outputs.skip_commit != 'true' }}
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        with:
          commit_message: 'style: auto-format'
          workflow: deny
          github_token: ${{ steps.octo-sts.outputs.token }}

      - name: Fail if lefthook failed
        if: steps.lefthook.outcome == 'failure'
        run: exit 1

  detect-changes:
    runs-on: ubuntu-slim
    outputs:
      frontend: ${{ steps.changes-frontend.outputs.any_changed }}
      backend: ${{ steps.changes-backend.outputs.any_changed }}
      agent: ${{ steps.changes-agent.outputs.any_changed }}
      workflow: ${{ steps.changes-workflow.outputs.any_changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - name: Check for frontend changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-frontend
        with:
          files: frontend/**

      - name: Check for backend changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-backend
        with:
          files: backend/**

      - name: Check for agent changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-agent
        with:
          files: agent/**

      - name: Check for workflow changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes-workflow
        with:
          files: .github/workflows/test.yml

  check-entity-sync:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_entity_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_entity_check
        run: cargo run -p migration -- up

      - name: Generate entities from database
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_entity_check
        run: bash scripts/generate-entities.sh

      - name: Check entity files are in sync
        working-directory: backend
        run: |
          if ! git diff --exit-code src/entities; then
            echo "::error::Entity files are out of sync with database schema."
            echo "Run 'bash backend/scripts/generate-entities.sh' locally and commit the changes."
            exit 1
          fi

  unit-test-frontend:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13

      - run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: cd "frontend" && pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: pnpm run test

  api-fuzzing-backend:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_api_fuzzing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Build backend
        working-directory: backend
        run: cargo build

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_api_fuzzing
        run: cargo run -p migration -- up

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_api_fuzzing
          BACKEND_PORT: '3000'
          RUST_LOG: info
        run: |
          cargo run > /tmp/backend.log 2>&1 &
          # サーバーが起動するまで待機
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Backend server is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Backend server failed to start within 30 seconds"
              cat /tmp/backend.log || true
              exit 1
            fi
            sleep 1
          done

      - name: Run Schemathesis API fuzzing
        uses: schemathesis/action@1f15936316e0742005bf69657b5909ac68f04cb3 # v2.1.0
        with:
          schema: http://localhost:3000/api-docs/openapi.json
          checks: all
          max-examples: 50
          config-file: backend/schemathesis.toml
          args: --workers 2

      - name: Dump backend log on failure
        if: failure()
        run: |
          echo "::group::backend.log"
          cat /tmp/backend.log || true
          echo "::endgroup::"

  unit-test-backend:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - run: rustup show

      # Run sccache-action before mise-action so that sccache binary is
      # available when mise installs cargo tools (RUSTC_WRAPPER=sccache).
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@50414676f9f5d50a65992c6dd2ed02641263226c # v2.82.10
        with:
          tool: cargo-llvm-cov

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_test
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/lcov.info
          flags: backend
          fail_ci_if_error: false

  unit-test-agent:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.agent == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: t_rader
          POSTGRES_PASSWORD: t_rader
          POSTGRES_DB: t_rader_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t_rader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13

      - run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('agent/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: cd "agent" && pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: agent
        env:
          TEST_DATABASE_URL: postgres://t_rader:t_rader@localhost:5432/t_rader_agent_test
        run: pnpm run test

  # Aggregation gate for the per-package unit-test jobs. The dynamic per-package
  # job names cannot be pinned as required status checks, so this single
  # fixed-name job is the branch protection gate instead. It fails only when a
  # needed job failed; when every leg succeeds (or is skipped because nothing
  # changed) it is skipped, and a skipped required check counts as success.
  unit-test:
    runs-on: ubuntu-slim
    needs:
      - detect-changes
      - unit-test-frontend
      - unit-test-backend
      - unit-test-agent
    if: failure()
    steps:
      - run: exit 1
