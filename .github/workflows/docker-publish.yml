name: Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      components: ${{ github.event_name == 'workflow_dispatch' && steps.components.outputs.all || steps.filter.outputs.changed_keys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # docker-publish-components.json の dir から「自分のディレクトリ配下は無条件でそのコンポーネントの
      # 変更として扱う」ルールを生成し、exclude/extra だけを明示的な例外として合成する。
      # コンポーネントの実体 (どのディレクトリを持つか) は build job の context/file 解決とこの
      # ファイル 1 箇所だけで定義する。
      - id: components
        run: |
          components_file=.github/workflows/docker-publish-components.json
          all=$(jq -c 'keys' "$components_file")
          echo "all=$all" >> "$GITHUB_OUTPUT"

          filters=$(jq -c '
            to_entries | map({
              (.key): (
                [.value.dir + "/**"]
                + ((.value.exclude // []) | map("!" + .))
                + (.value.extra // [])
              )
            }) | add
          ' "$components_file")
          {
            echo "filters<<FILTERS_EOF"
            echo "$filters"
            echo "FILTERS_EOF"
          } >> "$GITHUB_OUTPUT"

      - if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          # JSON はそのまま有効な YAML なので、components ステップが生成した JSON を直接渡せる。
          files_yaml: ${{ steps.components.outputs.filters }}
          # changed_keys を fromJson() でそのまま matrix に渡せる JSON 配列にする。
          matrix: true

  build:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: ${{ fromJson(needs.changes.outputs.components) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        id: setup-buildx

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=sha
            type=raw,value=latest

      - id: paths
        run: |
          entry=$(jq -c --arg c "${{ matrix.component }}" '.[$c]' .github/workflows/docker-publish-components.json)
          echo "context=$(jq -r '.context' <<< "$entry")" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$(jq -r '.dir' <<< "$entry")/Dockerfile" >> "$GITHUB_OUTPUT"

      # backend: RUN --mount=type=cache のキャッシュを GHA キャッシュに永続化する。
      # GHA 環境では BuildKit cache mount のデータが type=gha バックエンドに保存されないため、
      # buildkit-cache-dance を使って actions/cache 経由で永続化する。
      # ref: https://github.com/moby/buildkit/issues/3011
      - name: Restore Cargo cache
        if: matrix.component == 'backend'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cargo-cache
        with:
          path: cargo-cache
          key: cargo-cache-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-cache-

      - name: Inject Cargo cache into Docker
        if: matrix.component == 'backend'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: cargo-cache
          dockerfile: backend/Dockerfile
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.paths.outputs.context }}
          file: ${{ steps.paths.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # frontend/agent: レイヤーキャッシュを GHA cache backend で永続化する。
          # backend は cache mount + buildkit-cache-dance で永続化するため不要。
          # cache-from/cache-to と buildkit-cache-dance を併用すると、Post ステップの
          # extraction 用ビルドで BuildKit が cache mount をリセットしてしまう。
          # ref: https://github.com/reproducible-containers/buildkit-cache-dance/issues/33
          cache-from: ${{ matrix.component != 'backend' && format('type=gha,scope={0}', matrix.component) || '' }}
          cache-to: ${{ matrix.component != 'backend' && format('type=gha,mode=max,scope={0}', matrix.component) || '' }}
          # ghcr.io の private パッケージに push する際、provenance attestation の
          # manifest push 時に permission_denied: read_package エラーが発生する既知の問題
          # (ghcr.io 側の問題で、2026-02 時点で未修正) があるため無効化。
          # 代替手段として actions/attest-build-provenance を別ステップで使う方法があるが、
          # GitHub Enterprise Cloud プランが必要なため Free/Pro の private リポジトリでは利用不可。
          # ref: https://github.com/docker/build-push-action/issues/981
          # ref: https://github.com/docker/build-push-action/issues/900
          provenance: false

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false
