[package]
name = "backend"
version = "0.1.0"
edition = "2024"
default-run = "backend"

[dependencies]
async-trait = { workspace = true }
automod = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
core-domain = { workspace = true }
core-application = { workspace = true }
entrypoint-agent-mcp = { workspace = true }
entrypoint-agent-webhook = { workspace = true }
entrypoint-control-plane-mcp = { workspace = true }
entrypoint-external-webhook = { workspace = true }
entrypoint-frontend-api = { workspace = true }
gateway-fred = { workspace = true }
gateway-e-stat = { workspace = true }
gateway-alpha-vantage = { workspace = true }
gateway-boj = { workspace = true }
gateway-ecb = { workspace = true }
gateway-firecrawl = { workspace = true }
gateway-ibkr = { workspace = true }
gateway-jquants = { workspace = true }
gateway-sec = { workspace = true }
gateway-litellm = { workspace = true }
gateway-kata-exec = { workspace = true }
gateway-rss = { workspace = true }
gateway-t-rader-agent = { workspace = true }
gateway-postgres = { workspace = true }
entrypoint-scheduler = { workspace = true }
rate-limit = { workspace = true }
cron = { workspace = true }
csv = { workspace = true }
encoding_rs = { workspace = true }
futures-util = { workspace = true }
graphile_worker = { workspace = true }
graphile_worker_admin_ui = { workspace = true }
jsonschema = { workspace = true }
migration = { path = "../../../migration" }
percent-encoding = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
rmcp = { workspace = true, features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }
schemars = { version = "=1.2.2", features = ["chrono04", "uuid1"] }
rust_decimal = { workspace = true, features = ["serde-float", "serde-arbitrary-precision"] }
sea-orm = { workspace = true, features = [
    "runtime-tokio-native-tls",
    "sqlx-postgres",
    "with-chrono",
    "with-uuid",
    "with-rust_decimal",
    "macros",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
utoipa = { workspace = true, features = [
    "chrono",
    "uuid",
    "decimal_float",
    "axum_extras",
] }
indoc = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
uuid = { workspace = true, features = ["serde", "v4", "v5"] }

[dev-dependencies]
backend-test-macros = { path = "../../libs/test-macros" }
axum-test = { workspace = true }
core-application = { workspace = true, features = ["test-support"] }
gateway-jquants = { workspace = true, features = ["test-support"] }
gateway-postgres = { workspace = true, features = ["test-support"] }
rstest = { workspace = true }
sea-orm = { workspace = true, features = ["mock"] }
sqlx = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true
