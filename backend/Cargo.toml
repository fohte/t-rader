[workspace]
resolver = "3"
members = [
    "migration",
    "crates/*/*",
]
default-members = [
    "migration",
    "crates/*/*",
]

[workspace.dependencies]
async-trait = "=0.1.92"
axum = "=0.8.9"
automod = "=1.0.17"
core-domain = { path = "crates/core/domain" }
core-application = { path = "crates/core/application" }
entrypoint-agent-mcp = { path = "crates/entrypoints/agent-mcp" }
entrypoint-agent-webhook = { path = "crates/entrypoints/agent-webhook" }
entrypoint-control-plane-mcp = { path = "crates/entrypoints/control-plane-mcp" }
entrypoint-external-webhook = { path = "crates/entrypoints/external-webhook" }
entrypoint-frontend-api = { path = "crates/entrypoints/frontend-api" }
entrypoint-scheduler = { path = "crates/entrypoints/scheduler" }
gateway-fred = { path = "crates/gateways/fred" }
gateway-e-stat = { path = "crates/gateways/e-stat" }
gateway-alpha-vantage = { path = "crates/gateways/alpha-vantage" }
gateway-boj = { path = "crates/gateways/boj" }
gateway-ecb = { path = "crates/gateways/ecb" }
gateway-firecrawl = { path = "crates/gateways/firecrawl" }
gateway-ibkr = { path = "crates/gateways/ibkr" }
gateway-jquants = { path = "crates/gateways/jquants" }
gateway-kata-exec = { path = "crates/gateways/kata-exec" }
gateway-litellm = { path = "crates/gateways/litellm" }
gateway-postgres = { path = "crates/gateways/postgres" }
gateway-rss = { path = "crates/gateways/rss" }
gateway-t-rader-agent = { path = "crates/gateways/t-rader-agent" }
rate-limit = { path = "crates/libs/rate-limit" }
graphile_worker = "=0.13.5"
graphile_worker_admin_ui = "=0.2.3"
cron = "=0.17.0"
axum-test = "=18.7.0"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false }
chrono-tz = "=0.10.4"
clap = "=4.5.60"
csv = "=1.3.1"
encoding_rs = "=0.8.41"
futures-util = "=0.3.34"
htmd = "=0.5.5"
indoc = "=2.0.7"
jpholiday = "=0.2.0"
jsonschema = { version = "=0.46.9", default-features = false }
percent-encoding = "=2.3.2"
prettyplease = "=0.2.37"
progenitor = { version = "=0.14.0", default-features = false }
progenitor-client = "=0.14.0"
quick-xml = "=0.40.1"
redis = { version = "=0.32.7", default-features = false, features = ["script", "connection-manager", "tokio-comp"] }
reqwest = { version = "=0.13.5", default-features = false }
scraper = "=0.27.0"
rmcp = "=3.1.4"
rstest = "=0.26.1"
rust_decimal = "=1.40.0"
sea-orm = "=2.0.3"
sea-orm-migration = "=2.0.3"
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
serde_yaml_ng = "=0.10.0"
sqlx = "=0.9.0"
thiserror = "=2.0.20"
tokio = "=1.53.1"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
utoipa = "=5.4.0"
utoipa-axum = "=0.2.0"
utoipa-swagger-ui = "=9.0.2"
uuid = "=1.21.0"
unicode-normalization = "=0.1.25"
wiremock = "=0.6.5"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
disallowed_macros = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
