[workspace]
members = [".", "migration"]

[workspace.dependencies]
async-trait = "=0.1.91"
axum = "=0.8.9"
cron = "=0.17.0"
axum-test = "=18.7.0"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false }
clap = "=4.5.60"
csv = "=1.3.1"
encoding_rs = "=0.8.35"
jsonschema = { version = "=0.46.9", default-features = false }
percent-encoding = "=2.3.2"
quick-xml = "=0.40.1"
reqwest = { version = "=0.13.4", default-features = false }
rmcp = "=1.7.0"
rstest = "=0.26.1"
rust_decimal = "=1.40.0"
sea-orm = "=2.0.0-rc.40"
sea-orm-migration = "=2.0.0-rc.40"
serde = "=1.0.229"
serde_json = { version = "=1.0.150", features = ["arbitrary_precision"] }
sqlx = "=0.9.0"
thiserror = "=2.0.18"
tokio = "=1.49.0"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
utoipa = "=5.4.0"
utoipa-axum = "=0.2.0"
utoipa-swagger-ui = "=9.0.2"
uuid = "=1.21.0"
wiremock = "=0.6.5"

[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
cron = { workspace = true }
csv = { workspace = true }
encoding_rs = { workspace = true }
jsonschema = { workspace = true }
migration = { path = "migration" }
percent-encoding = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
rmcp = { workspace = true, features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }
schemars = { version = "=1.2.1", features = ["chrono04", "uuid1"] }
rust_decimal = { workspace = true, features = ["serde-float"] }
sea-orm = { workspace = true, features = [
    "runtime-tokio-native-tls",
    "sqlx-postgres",
    "with-chrono",
    "with-uuid",
    "with-rust_decimal",
    "macros",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
utoipa = { workspace = true, features = [
    "chrono",
    "uuid",
    "decimal",
    "axum_extras",
] }
indoc = "=2.0.7"
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
axum-test = { workspace = true }
rstest = { workspace = true }
sea-orm = { workspace = true, features = ["mock"] }
sqlx = { workspace = true, features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "migrate",
] }
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
disallowed_macros = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
