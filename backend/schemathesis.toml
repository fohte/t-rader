[generation]
# PostgreSQL の TEXT/VARCHAR カラムは null バイトを受け付けないため、
# ミドルウェアでグローバルに拒否している。OpenAPI の string 型は
# 通常 null バイトを含まない前提で使われるため、生成自体を無効化する。
allow-x00 = false

[checks]
# GET/DELETE エンドポイントのパスパラメータは URL 文字列にシリアライズされるため、
# Schemathesis が型をミューテートしても有効な文字列として送信される。
# stateful テストで作成されたリソースの UUID が再利用されると、
# サーバーが正常応答を返し false positive になる。
# ref: https://github.com/schemathesis/schemathesis/issues/2312
negative_data_rejection.enabled = false

# パスパラメータに含まれる UUID はランダム生成されるため、
# 対応するリソースが存在せず 404 が返る。これはスキーマ準拠のデータが
# 拒否されたのではなく、リソースが存在しないだけなので false positive になる。
# stateful テストでは実際のリソース ID が使われるため正しく検証される。
positive_data_acceptance.enabled = false

# dev opt-out (`KUBEOPENCODE_API_URL=disabled`) で起動すると戦略 Agent の
# reconcile が走らず agent_status が pending のまま残る。chat エンドポイントは
# pending 戦略への task 投入を 503 で正しく拒否するので、これを server error と
# 見なさない。本番では reconcile 完了後 ready に遷移するため発生しない。
[[operations]]
include-path-regex = "^/api/strategies/[^/]+/chat$"
[operations.checks.not_a_server_error]
expected-statuses = [503]

[phases.fuzzing]
# Fuzzing フェーズはランダム生成された UUID パスパラメータにより
# 存在しないリソースへのリクエストが大量に発生し、4xx レスポンスが
# schema validation mismatch として検出される。Coverage フェーズで
# 同じ failure が既に報告された場合、重複排除により "No issues found" と
# 表示されるが PhaseFinished(status=FAILURE) が exit code 1 を返す。
# Coverage フェーズと Stateful フェーズで十分にカバーされるため無効化する。
enabled = false
