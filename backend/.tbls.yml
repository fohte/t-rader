name: t-rader backend
docPath: docs/db
disableOutputSchema: true
er:
  format: mermaid
exclude:
  - public.seaql_migrations
  - _timescaledb_*.*
  - timescaledb_.*
lint:
  requireTableComment:
    enabled: true
  requireColumnComment:
    enabled: true
    exclude: [id, created_at, updated_at]
comments:
  - table: account_risk_policy
    tableComment: '口座全体に適用するリスク制限設定を保持する。'
    columnComments:
      risk_policy: '口座全体のリスク制限を表す JSON 設定。'
  - table: agent_config
    tableComment: 'purpose ごとのエージェント実行設定を保持する。'
    columnComments:
      purpose: '設定を選択するための目的キー。'
      agents_md: 'エージェントに渡す方針・制約を記述した Markdown。'
      skills: 'エージェントが利用する skill 名と内容の対応を表す JSON。'
      agent_graph: 'エージェントの実行グラフを記述した YAML。'
  - table: annotation
    tableComment: '銘柄などの対象へ付与したテキスト注釈を保持する。'
    columnComments:
      target_symbol: '注釈対象を識別する銘柄・参照の ID。'
      target_kind: '注釈対象の種類。'
      timestamp: '注釈を紐づける時刻。'
      price: '注釈を紐づける価格。'
      text: '注釈本文。'
      status: '注釈のレビュー状態。'
      linked_note_id: '注釈に関連付けたノート。'
      created_by_kind: '注釈を作成した主体の種別。'
      execution_step_id: '注釈を作成したタスク実行ステップの UUID。'
      execution_task_id: '注釈を作成したタスク実行の識別子。'
  - table: change_history
    tableComment: '主要レコードに対する作成・更新・削除・状態変更を記録する監査履歴。'
    columnComments:
      target_kind: '変更対象のレコード種別。stock は銘柄、stock_group は銘柄グループを表す。'
      target_id: '変更対象レコードの ID。'
      actor_kind: '変更を行った主体の種別。'
      actor_label: '変更を行った主体の表示名。'
      op: '記録した操作の種別。'
      diff_json: '変更内容を表す JSON 差分。'
      summary: '変更理由などの補足説明。'
